<style>
  :root{--paper:#ece5d3;--panel:#f5f0e4;--card:#fbf8f0;--ink:#2d3a30;--muted:#7d8577;--line:#d9d0bb;--green:#2f6b4f;--green-dark:#1f4a36;--hi:#dde7d0;--gold:#b88a2e;--red:#b8553f;--hatch:#e8bcb0}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.35 'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  header,#info,#controls{width:min(100%,640px);margin-inline:auto}
  #info{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  @media (max-width:640px){ #info{border-left:0;border-right:0} }
  .mono{font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.14em}
  header{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line)}
  header .titles{flex:none}
  .btns{display:flex;gap:6px}
  h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
  #course{display:none}
  /* the three racks as chips in the header: number, points (or ball count) and result */
  #card9{flex:1;display:flex;justify-content:center;gap:4px;min-width:0}
  #card9 .c{display:flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font:500 11px 'DM Mono',monospace;color:var(--muted);white-space:nowrap;transition:background .3s}
  #card9 .c.cur{background:var(--hi);border-color:#b9c9a8;color:var(--ink)}
  #card9 .c b{font-weight:700;color:var(--ink)}
  #card9 .c.lives{font-size:12px;letter-spacing:1px}
  .card-par{border-collapse:collapse;margin:12px auto 2px;font-size:13px;font-variant-numeric:tabular-nums}
  .card-par th,.card-par td{padding:4px 8px;border:1px solid var(--line);text-align:center}
  .card-par th{font-weight:500;color:var(--muted)}
  #card9 .c.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
  #card9 .c.b1 .v{color:#2f6b4f} #card9 .c.b2 .v{color:var(--gold)} #card9 .c.o1 .v{color:var(--red)}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:crosshair}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #info{display:grid;grid-template-columns:1.6fr 1fr 1fr;border-bottom:1px solid var(--line);background:var(--paper)}
  #info > div{padding:6px 12px 7px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:#5a6556;white-space:nowrap;overflow:hidden}
  #info > div + div{border-left:1px solid var(--line)}
  #info b{display:block;margin-top:2px;font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:-.01em;text-transform:none;font-size:18px;color:var(--ink);line-height:1.1}
  #info b.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
  #info b{transform-origin:left center}
  #info b small{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#5a6556;font-weight:400;margin-left:4px}
  .round{width:30px;height:30px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px rgba(60,45,25,.16);font:600 15px 'DM Sans',sans-serif;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
  .round.off{opacity:.45}
  #controls{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
  #controls{position:relative;display:grid;grid-template-columns:1fr 78px;column-gap:12px;row-gap:12px}
  #rowA{grid-column:1;grid-row:1;display:grid;grid-template-columns:1fr;gap:10px}
  #rowB{grid-column:1;grid-row:2;display:flex;align-items:center;gap:12px;min-height:106px}
  #strip{position:relative;height:46px;border-radius:14px;overflow:hidden;touch-action:none;cursor:ew-resize;background:#e9e1cc;border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(60,45,25,.18)}
  #stripFace{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#b9ad92 0 2px,transparent 2px 12px);opacity:.75;-webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
  #strip::before,#strip::after{position:absolute;top:50%;transform:translateY(-50%);font:700 18px 'DM Sans',sans-serif;color:var(--muted);pointer-events:none}
  #strip::before{content:'‹';left:10px} #strip::after{content:'›';right:10px}
  #stripVal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;pointer-events:none;font:700 14px 'DM Sans',sans-serif;line-height:1.05;white-space:nowrap}
  #stripVal small{display:block;font:500 8.5px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  #strip.off,#rowB.off,#pull.off{opacity:.5}
  /* spin: a small cue ball; tap to cycle Stun, Follow, Draw. The dot is where the tip will hit. */
  #spinBall{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;touch-action:none;cursor:ns-resize;color:var(--ink)}
  #spinFace.pulse{animation:spinPulse 1.4s ease-out infinite}
  @keyframes spinPulse{0%{box-shadow:0 3px 0 #1d251f,0 0 0 0 rgba(226,177,60,.8)}100%{box-shadow:0 3px 0 #1d251f,0 0 0 16px rgba(226,177,60,0)}}
  #spinFace{position:relative;width:106px;height:106px;border-radius:50%;background:#2f3a31;box-shadow:0 3px 0 #1d251f,0 5px 12px rgba(60,45,25,.25)}
  #spinFace .f{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf7,#d8cdb4);box-shadow:inset 0 0 0 5px rgba(184,85,63,.25)}
  #spinFace .f::before,#spinFace .f::after{content:'';position:absolute;background:rgba(60,45,25,.15)}
  #spinFace .f::before{left:0;right:0;top:50%;height:1px} #spinFace .f::after{top:0;bottom:0;left:50%;width:1px}
  #spinFace .f i{position:absolute;left:0;right:0;font:700 9.5px 'DM Mono',monospace;letter-spacing:.06em;text-align:center;color:rgba(60,45,25,.45);font-style:normal}
  #spinDot{position:absolute;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:rgba(226,177,60,.8);border:2px solid #b88a2e;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  #spinBall.drag #spinFace{transform:scale(1.08);box-shadow:0 3px 0 #1d251f,0 0 0 4px rgba(226,177,60,.5)}
  #spinTxt b{display:block;font:800 16px 'DM Sans',sans-serif}
  #spinTxt small{display:block;font:500 9px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  #spinTxt{flex:1;min-width:0}
  #spinFace{flex:none}
  .spinCol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  #hint{font-size:9.5px;color:var(--muted);line-height:1.35;text-align:left}
  @media (max-width:380px){ #strip::before,#strip::after{display:none} #spinFace{width:92px;height:92px} #rowB{min-height:92px;gap:8px} #spinTxt b{font-size:15px} #spinTxt small{font-size:8px} }
  #hint b{font:800 16px 'DM Sans',sans-serif;color:var(--ink);letter-spacing:0;margin-left:4px}
  /* the pull-back cue: drag down to load power, release on the gold spot to shoot */
  #pull{grid-column:2;grid-row:1/3;position:relative;border-radius:16px;overflow:hidden;touch-action:none;cursor:ns-resize;background:#2f3a31;box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 3px 0 #1d251f}
  #pullFill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,#9fc495,#e3a07a 70%,#c4472f)}
  #pullCue{position:absolute;left:50%;top:0;width:14px;height:100%;margin-left:-7px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#3b5ea6 0 6px,#fbf8f0 6px 16px,#f1e3c4 16px,#d6a86e 60%,#3b2418 61%,#3b2418);box-shadow:2px 3px 6px rgba(0,0,0,.35)}
  #pullLab{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:800 11px 'DM Mono',monospace;letter-spacing:.06em;color:#fbf8f0;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;line-height:1.2}
  #pullLab small{font-size:9px;font-weight:600}
  #demoHand{position:absolute;left:50%;top:0;width:44px;height:44px;margin-left:-14px;font-size:34px;line-height:44px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));z-index:3}
  #demoTip{position:absolute;right:calc(100% + 10px);top:22%;width:max-content;max-width:150px;padding:7px 10px;border-radius:12px;background:#2f6b4f;color:#fbf8f0;font:700 13px/1.25 'DM Sans',sans-serif;text-align:right;pointer-events:none;box-shadow:0 4px 10px rgba(30,40,30,.25);z-index:3}
  #demoTip::after{content:'';position:absolute;right:-6px;top:14px;border:6px solid transparent;border-right:0;border-left-color:#2f6b4f}
  #pull.demo{overflow:visible}
  #spinHand{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-6px 0 0 -8px;font-size:30px;line-height:40px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));z-index:3}
  #aimHand{position:absolute;left:0;top:2px;width:44px;height:44px;font-size:32px;line-height:44px;text-align:center;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));z-index:3;opacity:0}
  #pull.pulse{animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 0 0 rgba(226,177,60,.7)}100%{box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 0 14px rgba(226,177,60,0)}}
  #act{position:absolute;inset:10px 16px max(10px,env(safe-area-inset-bottom));display:none;touch-action:none;border:0;border-radius:14px;background:var(--green);color:#f4f6ef;font:800 22px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--green-dark);z-index:2}
  #act.show{display:block}
  #act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dark)}
  #overlay{position:fixed;inset:0;z-index:10;background:rgba(236,229,211,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .3s}
  #overlay.show{opacity:1;pointer-events:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(60,45,25,.18);max-width:440px;width:100%;padding:22px;text-align:center;margin:auto;transform:translateY(12px);transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}
  #overlay.show .card{transform:none}
  .card h2{margin:4px 0 6px;font-size:24px;font-weight:800}
  .card .k{font-size:11px;color:var(--muted)}
  .card .big{font-size:54px;font-weight:800;line-height:1;margin:8px 0 2px}
  .howto{text-align:left;font-size:14px;color:#4c574a}
  .howto p{margin:9px 0}
  .howto b{color:var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin:14px auto 0;max-width:340px;background:var(--panel)}
  .stats div{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .stats div + div{border-left:1px solid var(--line)}
  .stats b{font-size:22px;font-weight:800;line-height:1}
  .stats span{font:500 9.5px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .near{display:inline-block;margin:8px 0 2px;padding:5px 12px;border-radius:999px;background:#f3e3b8;color:#7a5a12;font:700 14px 'DM Sans',sans-serif}
  #rank{margin:12px auto 0;max-width:320px;padding:8px 12px;border-radius:12px;background:var(--hi);color:var(--ink)}
  #rank b{display:block;font:800 16px 'DM Sans',sans-serif}
  #rank small{display:block;font:500 10px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .fbrow{margin-top:10px;font-size:13px}
  .fbrow a{color:var(--muted)}
  .mini{display:grid;grid-template-columns:auto repeat(3,1fr) auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0;font-family:'DM Mono',monospace;font-size:12px}
  .mini div{padding:5px 0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .mini div.h{padding:5px 6px;color:var(--muted);border-left:0}
  .mini div.t{padding:5px 6px}
  .mini div.r0{border-top:0}
  #share{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;text-align:left;margin:12px auto;max-width:300px;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}
  .btn.primary{background:var(--green);border-color:var(--green);color:#f4f6ef}
  @media (max-width:420px){ h1{font-size:15px} header{padding:6px 8px 6px 12px} #card9 .c{padding:3px 5px;font-size:10px} #info b{font-size:16px} #info > div{padding:5px 9px 6px} }
</style>

<body>
<div id="app">
  <header>
    <div class="titles"><h1>Daily Break</h1><span class="mono" id="course"></span></div>
    <div id="card9"></div>
    <div class="btns">
      <button class="round" id="snd" title="Sound: all / effects only / off">🔊</button>
      <button class="round" id="help" title="How to play">?</button>
    </div>
  </header>
  <div id="info"><div id="iHole"></div><div id="iLie"></div><div id="iTilt"></div></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls">
    <div id="rowA">
      <div id="strip" title="Swipe to aim (← →)"><div id="stripFace"></div><div id="stripVal"></div></div>
    </div>
    <div id="rowB">
      <div id="spinBall" title="Spin: drag the gold spot (up/down arrows)"><div id="spinFace"><div class="f"><i style="top:7%">FOLLOW</i><i style="bottom:7%">DRAW</i><span id="spinDot"></span></div></div><div class="spinCol"><div id="spinTxt"></div><div id="hint" class="mono"></div></div></div>
    </div>
    <div id="pull" class="pulse" title="Pull down, let go to shoot (or hold Space)"><div id="pullFill"></div><div id="pullCue"></div><div id="pullLab"></div></div>
    <button id="act">…</button>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
/* =================== core: racks and physics (no DOM) =================== */

const W = 500, H = 1000, RAIL = 40, R = 17, DT = 1 / 240, TAU = Math.PI * 2;
const MAX_SPEED = 2600, ROLL_DECEL = 240, LIN_DAMP = 0.32, STOP = 6;
const BALL_E = 0.95, BUMPER_E = 0.9, CUSHION_E = 0.78, POT_MAX_SPEED = 1050;
const LIVES = 4, MAX_BALLS = 15, PX_PER_IN = 10;
// 0 is the cue ball; 1-8 solids, 9-15 stripes (a level can hold up to 15 balls).
const COLORS = ['#f4efe2', '#e2b13c', '#3b5ea6', '#c4472f', '#6a4b8c', '#dc7a30', '#3d8758', '#86372b', '#24221f', '#e2b13c', '#3b5ea6', '#c4472f', '#6a4b8c', '#dc7a30', '#3d8758', '#86372b'];
const POCKETS = [
  { x: 0, y: 0, cap: R * 1.75 }, { x: W, y: 0, cap: R * 1.75 },
  { x: -5, y: H / 2, cap: R * 1.55 }, { x: W + 5, y: H / 2, cap: R * 1.55 },
  { x: 0, y: H, cap: R * 1.75 }, { x: W, y: H, cap: R * 1.75 },
];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = key => mulberry32(hashStr('daily-break:' + key));
function shuffle(rnd, arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const isDailySeed = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
// Days are named by date ("11 Nov"), not numbered.
function dayLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
}

const NAME_A = ['Velvet', 'Brass', 'Juniper', 'Amber', 'Willow', 'Copper', 'Moss', 'Ivory', 'Saffron', 'Linden', 'Hazel', 'Marigold'];
const NAME_B = ['Room', 'Parlour', 'Hall', 'Lounge', 'Club', 'Den', 'House', 'Rooms'];
function courseName(seed) {
  const r = rngFor(seed + ':name');
  return `${NAME_A[Math.floor(r() * NAME_A.length)]} ${NAME_B[Math.floor(r() * NAME_B.length)]}`;
}

// Where a ball must travel to drop in pocket i (just inside the mouth).
function pocketAim(i, h) {
  if (h?.shape) return h.shape.pockets[i].aim;
  const p = POCKETS[i];
  return { x: p.x <= 0 ? R + 1 : p.x >= W ? W - R - 1 : p.x, y: p.y <= 0 ? R + 1 : p.y >= H ? H - R - 1 : p.y };
}

// ---- table shapes ----
// From level 3, each level is played on a table shape drawn for the day (the same for everyone): the classic
// rectangle or one of these. Every shape fits the same 500 x 1000 box and has six pockets. Levels 1-2, days
// before SHAPES_FROM and classic levels run exactly the old rectangle code, so their layouts never change.
const SHAPES_FROM = '2026-11-12';
const SPREAD_FROM = '2026-11-13';   // balls no longer start in touching clusters (see buildHole)
const SHAPES_ON = true;   // set false to go back to the classic table only
const segDist0 = (px, py, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, u = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)); return Math.hypot(ax + dx * u - px, ay + dy * u - py); };
function inPoly(pts, x, y) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }

/* ----- round / hole flow ----- */

  $('course').textContent = `${courseName(seed)} · ${isDailySeed(seed) && ranked ? dayLabel(seed) : 'practice'}`;
  const saved = ranked ? ls(round.par ? parKey(seed) : 'dailybreak:ladder:' + seed) : null;
  if (!saved && resumeRun()) return;

}

  renderCard9(); updateUI();
}

// Each shot starts lined up dead centre on the ball with the easiest pot.

  // film grain: hop the noise tile to a new random offset ~12 times a second, so it shimmers in place
  // (sliding it steadily made it read as diagonal rain)
  const gf = Math.floor(t * 12), gx = hash01(gf) * 160, gy = hash01(gf + 0.5) * 160;
  ctx.save(); ctx.translate(gx, gy); ctx.fillStyle = GRAIN; ctx.fillRect(-160, -160, cw + 320, ch + 320); ctx.restore();
}

/* ----- loop ----- */

function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, t - (frame.last ?? t));
  frame.last = t;
  if (hold) {
    const d = contactDiff(), was = tipOnSpot(d);
    swayT += dt;
    if (!was && tipOnSpot(d)) { tone(1046, 0.03, 0.02, 'sine', 1, 0, 0); buzz(3); }
  }
  if (phase === 'strike') {
    const was = strike.t;
    strike.t += dt;
    if (strike.lesson) aimLesson(was, strike.t);
    if (strike.spinLesson) spinLesson(was, strike.t);
    // the close-up's tip lands: the click and buzz go with it
    if (was < STRIKE_T && strike.t >= STRIKE_T) {
      const q = zoom?.teach?.quality || zoom?.ct.quality;   // the first shot's lesson sounds like where they really hit
      if (q === 'miscue') { sfx.miscue(); buzz([20, 30, 20]); }
      else { sfx.thock(strike.power); buzz(q === 'clean' ? [14, 25, 8] : 10); if (q === 'clean') sfx.chime(); }
    }
    // then, once the close-up has gone, the cue on the table strikes and the balls roll
    if (strike.t >= strike.end) {
      table.shoot(strike.angle, strike.power, strike.spin);
      const q = zoom?.ct.quality, c0 = table.cue, fy = c0.y - 50 < 30 ? c0.y + 50 : c0.y - 50;
      if (q === 'clean') { sparkle(c0.x, c0.y, '#e2b13c', 14, 110); float(c0.x, fy, 'Clean strike', '#b88a2e', 20); }
      else if (q === 'miscue') { fx.shake = 5; float(c0.x, fy, 'Miscue!', '#b8553f', 22); for (let k = 0; k < 14; k++) { const a = Math.random() * TAU, v = 40 + Math.random() * 90; fx.particles.push({ x: c0.x, y: c0.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.4, color: '#8fb4e8', r: 1.5 + Math.random() * 2.5 }); } }
      else if (q) float(c0.x, fy, zoom.ct.off ? `Off-centre: pushed ${zoom.ct.off < 0 ? 'left' : 'right'}` : 'Off-centre', q === 'near' ? '#7a6a3a' : '#b8553f', 18);
      sfx.clack(strike.power * 1600);
      const c = table.cue;
      for (let k = 0; k < 8; k++) fx.particles.push({ x: c.x - Math.cos(strike.angle) * R, y: c.y - Math.sin(strike.angle) * R, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, life: 0.5, color: '#7fa0d8', r: 1.5 });
      acc = 0; movingT = 0; phase = 'moving'; updateUI();
      if (generous()) {
        shotRec = []; shotSteps = 0; replayed = false; lip = null; lipTried = new Set();
        follow = { x: c.x, y: c.y, angle: strike.angle, power: strike.power, t: 0 };
        cam.k += 0.03 + 0.04 * strike.power;   // a small push in on the strike, which eases back
      }
    }
  }
  // Slow motion and a push-in as the rack's last ball heads for the pocket.
  let slow = false, tk = 1, tx = W / 2, ty = H / 2;
  if (cine) {
    const b = table.balls.find(o => o.n === cine.n), p = table.pk[cine.pocket], px = clamp(p.x, 0, W), py = clamp(p.y, 0, H);
    if (cine.hold > 0) { cine.hold -= dt; slow = true; tk = 1.35; tx = px; ty = py; }
    else if (b && !b.potted && (b.vx || b.vy) && Math.hypot(b.x - p.x, b.y - p.y) < 230) { slow = true; tk = 1.3; tx = (b.x + px) / 2; ty = (b.y + py) / 2; }
  }
  // The windmill (short round) keeps turning while you aim and strike, at the speed it turns in play, so you can
  // time a shot through a gap; it waits if a ball has come to rest inside its sweep, so it never turns into one.
  const wm = hole?.obst?.type === 'windmill' ? hole.obst : null;
  if (wm && generous() && (phase === 'aim' || phase === 'strike') && table.live().every(b => Math.hypot(b.x - wm.x, b.y - wm.y) > wm.len + BAR_T + R + 2)) table.wa += WM_W * dt * PLAY;
  // A ball on the lip (short round): one slow, close call near a pocket gets slow motion, a push-in and a heartbeat,
  // then "It dropped!" or "So close!". The outcome is known first by playing the rest of the shot out, so it only
  // happens when it really is close (it drops, or stops within a ball and a half of the pocket).
  if (phase === 'moving' && generous() && !cine) {
    if (!lip) for (const b of table.balls) {
      const sp = Math.hypot(b.vx, b.vy);
      if (b.potted || sp < 20 || sp > 330) continue;
      table.pk.forEach((p, i) => {
        const key = b.n + ':' + i;
        if (lip || lipTried.has(key) || !table.openPocket(i)) return;
        const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy);
        if (d > p.cap + R * 2.6 || dx * b.vx + dy * b.vy <= 0) return;
        lipTried.add(key);
        const sim = cloneTable(table), sb = sim.balls[table.balls.indexOf(b)];
        for (let n = 0; n < 4000 && sim.moving(); n++) sim.step();
        const drops = sb.potted && sim.shot.pots.some(q => q.ball === sb && q.pocket === i);
        if (drops || (!sb.potted && Math.hypot(sb.x - p.x, sb.y - p.y) < p.cap + R * 1.5)) lip = { n: b.n, i, drops, t: 0, beat: 0 };
      });
    }
    if (lip) {
      const b = table.balls.find(o => o.n === lip.n), p = table.pk[lip.i];
      lip.t += dt; lip.beat -= dt;
      if (lip.beat <= 0) { lip.beat = 0.5; tone(58, 0.16, 0.3, 'sine', 0.6, 0, 0); tone(52, 0.14, 0.22, 'sine', 0.6, 0.13, 0); buzz(12); }
      const done = b.potted || (!b.vx && !b.vy) || lip.t > 5;
      if (done) {
        const fy = clamp(p.y + (p.y < H / 2 ? 80 : -80), 60, H - 60), fxp = clamp(p.x, 100, W - 100);
        if (b.potted) { float(fxp, fy, 'It dropped!', '#2f6b4f', 28, 2); confettiBurst(60); fx.glow = 1; buzz([20, 30, 40]); }
        else { float(fxp, fy, 'So close!', '#b8553f', 26, 2); tone(330, 0.5, 0.06, 'triangle', 0.6, 0, 0.3); p.wobble = 1; fx.shake = 3; catStartle = 1; }
        lip = null;
      } else { slow = true; tk = 1.5; tx = (b.x + clamp(p.x, 0, W)) / 2; ty = (b.y + clamp(p.y, 0, H)) / 2; }
    }
  }
  // Fast-forward the dead time: a tap on the table (once the shot has rolled for 0.8 s) plays the rest at
  // 3×, and once everything is just creeping (under 35, after 2 s) it runs at 1.6× by itself. Otherwise the
  // table plays at PLAY (0.75×). Never during the slow-motion finish.
  if (phase === 'moving') movingT += dt;
  const creeping = phase === 'moving' && movingT > 2 && table.live().every(b => Math.hypot(b.vx, b.vy) < 35);
  const want = slow ? 0.25 : phase === 'replay' ? 0.45 : phase !== 'moving' ? 1 : ffwd ? 3 : creeping ? 1.6 : PLAY;
  timeScale = want > timeScale ? want : lerp(timeScale, want, Math.min(1, dt * 10));
  const ck = Math.min(1, dt * 5);
  cam.k = lerp(cam.k, tk, ck); cam.x = lerp(cam.x, tx, ck); cam.y = lerp(cam.y, ty, ck);
  if (phase === 'moving') {
    if (hitStop > 0) hitStop -= dt;   // a blink of freeze on big moments
    else { acc += dt * timeScale; while (acc >= DT) { table.step(); acc -= DT; shotSteps++; } }
    const c = table.cue, last = curTrail?.pts[curTrail.pts.length - 1];
    if (curTrail && !c.potted && last && Math.hypot(c.x - last[0], c.y - last[1]) > 14) curTrail.pts.push([c.x, c.y]);
    if (shotRec && shotRec.length < 3000) shotRec.push([shotSteps * DT, c.x, c.y, c.potted ? 1 : 0, ...table.balls.flatMap(b => [b.x, b.y, b.potted ? 1 : 0])]);
    if (!table.moving() && !(cine && cine.hold > 0)) resolveShot();
  }
  if (rollGain) {
    const v = phase === 'moving' && table ? table.live().reduce((a, b) => a + Math.hypot(b.vx, b.vy), 0) : 0;
    rollGain.gain.setTargetAtTime(Math.min(1, v / 2600) * 0.11, audio.currentTime, 0.05);
    rollFilter.frequency.setTargetAtTime(180 + Math.min(1, v / 2600) * 320, audio.currentTime, 0.05);
  }
  // the points total counts up rather than jumping
  if (hs && shownPts !== hs.points) {
    const d = hs.points - shownPts;
    shownPts = Math.abs(d) < 3 ? hs.points : shownPts + Math.ceil(Math.abs(d) * Math.min(1, dt * 8)) * Math.sign(d);
    const el = document.getElementById('ptsVal');
    if (el) el.textContent = shownPts.toLocaleString();
    if (Math.abs(d) > 2 && audio && audio.currentTime - lastTick > 0.05) { lastTick = audio.currentTime; tone(1500 + Math.random() * 200, 0.012, 0.012, 'sine', 1, 0, 0); }
  }
  // the replay plays the recorded shot at about half speed, then the shot is scored as usual
  if (phase === 'replay') {
    replay.T += dt * replay.speed;
    if (replay.T >= replay.endT) { replay = null; replayed = true; phase = 'moving'; resolveShot(); }
  }
  if (follow) follow.t += dt;
  tickDemo(dt); tickSpinDemo(dt);
  // a drawing error must never stop the game: log it and carry on with the next frame
  try { draw(t, dt); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

resize();
// old ?seed= links open a practice run (counted), or today's game once practice is used up
const seedParam = new URLSearchParams(location.search).get('seed');
const firstVisit = !ls('dailybreak:seenHelp');
if (seedParam && practiceLeft() > 0) { usePractice(); newRound(seedParam, false); } else { newRound(todayKey(), true); track('open'); track(firstVisit ? 'opennew' : 'openback'); }
// the first time the page is hidden before today's first shot: how long they'd been here and on which screen
// (some come back and play later; this is one event per device per day)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden' || !round || ls(`dailybreak:ev:${round.seed}:shot`)) return;
  const where = $('overlay').classList.contains('show') ? 'intro' : ls(`dailybreak:ev:${round.seed}:pull`) ? 'pulled' : 'table';
  track('left', { secs: Math.min(86400, Math.round(performance.now() / 1000)), where });
});
if (!ls('dailybreak:seenHelp') && !$('overlay').classList.contains('show')) showIntro();
requestAnimationFrame(frame);
</script>
</body>
