<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141c33">
<title>Daily Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f3f1ea;--muted:#b9c0d4;--accent:#ffd27a;--glass:rgba(20,26,48,.42);--glass-line:rgba(255,255,255,.12);--mult:#ff8ad8;--chips:#8fd0ff}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#141c33;color:var(--ink);font:600 15px/1.35 Nunito,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
  .top,#hud,#relics{width:min(100%,560px)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 6px}
  h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.3px;line-height:1.1}
  h1 span{color:var(--accent)}
  .meta{color:var(--muted);font-size:12px}
  .btns{display:flex;gap:6px}
  .icon-btn{width:36px;height:36px;padding:0;border-radius:50%;font-size:15px}
  .icon-btn.off{opacity:.45}
  .glass{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
  #hud{padding:8px 14px 10px;display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 14px;align-items:end;font-variant-numeric:tabular-nums}
  .stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:800}
  .stat b{display:inline-block;font-size:17px;color:var(--accent);font-weight:900}
  .stat .sub{color:var(--muted);font-size:12px;margin-left:5px}
  #live{font-size:15px;min-width:64px}
  #live .c,.c{color:var(--chips)} #live .m,.m{color:var(--mult)}
  .prog{grid-column:1/-1;position:relative;height:20px;background:rgba(0,0,0,.28);border-radius:999px;overflow:hidden;margin-top:6px}
  #progFill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,#7fd1b9,#ffd27a);box-shadow:0 0 14px rgba(255,210,122,.55)}
  #progTxt{position:relative;display:block;text-align:center;font-size:12px;line-height:20px;font-weight:900;text-shadow:0 1px 2px #0009}
  .dots{display:flex;gap:5px;height:24px;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(255,210,122,.6);transition:all .5s}
  .dot.used{background:rgba(255,255,255,.14);box-shadow:none;transform:scale(.65)}
  .bump{animation:bump .5s ease}
  @keyframes bump{30%{transform:scale(1.4)}}
  #relics{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-top:6px}
  #relics:empty{display:none}
  .relic{font-size:12px;padding:3px 10px;border-radius:999px;cursor:help;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:crosshair}
  canvas#c{display:block;filter:drop-shadow(0 24px 30px rgba(0,0,0,.5))}
  button{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--glass-line);border-radius:12px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
  button:hover:not(:disabled){border-color:var(--accent);background:rgba(255,255,255,.14)}
  button:active:not(:disabled){transform:scale(.95)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--accent);color:#2a1d05;border-color:var(--accent)}
  button.primary:hover:not(:disabled){background:#ffe0a0}
  #overlay{position:fixed;inset:0;z-index:5;background:rgba(10,14,28,.4);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .35s}
  #overlay.show{opacity:1;pointer-events:auto}
  .card{max-width:560px;width:100%;text-align:center;margin:auto;padding:22px;background:rgba(24,30,56,.72);transform:translateY(16px) scale(.96);transition:transform .5s cubic-bezier(.2,.9,.3,1.25)}
  #overlay.show .card{transform:none}
  .card h2{margin:0 0 6px;font-weight:900;font-size:24px}
  .rewards{color:var(--muted);font-size:14px;margin:6px 0 14px}
  .rewards b{color:var(--accent)}
  .offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .offer{background:rgba(0,0,0,.2);border:1px solid var(--glass-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .2s}
  .offer:hover{transform:translateY(-3px)}
  .offer .icon{font-size:30px}
  .offer .name{font-weight:900}
  .offer .desc{color:var(--muted);font-size:13px;flex:1}
  .offer.sold{opacity:.35}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  #share{white-space:pre-wrap;background:rgba(0,0,0,.25);border-radius:12px;padding:12px;font-size:15px;text-align:left;margin:14px auto;max-width:380px}
  .howto{text-align:left;color:var(--muted);font-size:14px}
  .howto p{margin:8px 0}
  .howto b{color:var(--ink)}
  .boss{color:#ff9a7a}
  @media (max-width:420px){ .stat .sub{display:none} #hud{gap:2px 10px;padding:7px 12px 9px} h1{font-size:18px} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <header class="top">
    <div><h1>Daily <span>Break</span></h1><div class="meta" id="meta"></div></div>
    <div class="btns">
      <button class="icon-btn" id="help" title="How to play">?</button>
      <button class="icon-btn" id="music" title="Music">🎵</button>
      <button class="icon-btn" id="mute" title="Sound">🔊</button>
    </div>
  </header>
  <div id="hud" class="glass">
    <div class="stat"><small>Table</small><b id="tbl"></b><span class="sub" id="tier"></span></div>
    <div class="stat"><small>Shots</small><div class="dots" id="shots"></div></div>
    <div class="stat"><small>Coins</small><b id="coins"></b></div>
    <div class="stat"><small>This shot</small><b id="live">–</b></div>
    <div class="prog"><div id="progFill"></div><span id="progTxt"></span></div>
  </div>
  <div id="relics"></div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<div id="overlay"><div class="card glass" id="card"></div></div>

<script>
/* ---------- game logic (no DOM) ---------- */

const W = 500, H = 1000, RAIL = 40, R = 15, DT = 1 / 240, TAU = Math.PI * 2;
const BASE_MAX_SPEED = 2600, ROLL_DECEL = 240, LIN_DAMP = 0.32, STOP = 6;
const BALL_E = 0.95, BUMPER_E = 0.9, BASE_CUSHION_E = 0.78;
const MAX_DRAG = 260, BASE_SHOTS = 6, TABLES = 9, MAX_RELICS = 6, START_COINS = 4;
const TARGETS = [80, 140, 220, 320, 450, 650, 900, 1250, 1700];
const TIERS = ['Opener', 'Main', 'Boss'];
const EPOCH = Date.UTC(2026, 10, 9);
const COLORS = ['#fdfcf7', '#f4c430', '#1f4fd1', '#d62828', '#6a2c91', '#f07b1d', '#1c8a3c', '#8b1e1e', '#151515', '#f4c430'];
const POCKETS = [
  { x: 0, y: 0, cap: R * 2.0 }, { x: W, y: 0, cap: R * 2.0 },
  { x: -5, y: H / 2, cap: R * 1.8 }, { x: W + 5, y: H / 2, cap: R * 1.8 },
  { x: 0, y: H, cap: R * 2.0 }, { x: W, y: H, cap: R * 2.0 },
];
const SPECIAL = { gold: '#ffd700', mult: '#ff5ad9', bomb: '#ff4433' };

const RELICS = [
  { id: 'bank', icon: '🏦', name: 'Bank Shot', price: 5, desc: 'Banked pots give +2 mult instead of +1.' },
  { id: 'chain', icon: '⛓️', name: 'Chain Reaction', price: 6, desc: 'Each extra ball in one shot gives +2 mult instead of +1.' },
  { id: 'wide', icon: '🕳️', name: 'Wide Pockets', price: 6, desc: 'Pockets are 25% bigger.' },
  { id: 'chalk', icon: '🧊', name: 'Extra Chalk', price: 5, desc: '+1 shot on every table.' },
  { id: 'insurance', icon: '🛟', name: 'Insurance', price: 4, desc: 'Your first scratch on each table still scores.' },
  { id: 'heavy', icon: '🏋️', name: 'Heavy Cue', price: 5, desc: 'Cue ball is 60% heavier and hits harder.' },
  { id: 'magnet', icon: '🧲', name: 'Magnet Pockets', price: 7, desc: 'Pockets pull nearby balls in.' },
  { id: 'bumper', icon: '🎯', name: 'Bumper Cars', price: 4, desc: '+15 chips per bumper hit on a scoring shot.' },
  { id: 'midas', icon: '👑', name: 'Midas Touch', price: 4, desc: 'Gold balls give double coins.' },
  { id: 'high', icon: '🎲', name: 'High Roller', price: 5, desc: 'Potting a 7, 8 or 9 gives +3 mult.' },
  { id: 'piggy', icon: '🐷', name: 'Piggy Bank', price: 4, desc: 'After each table, +1 coin per 5 you hold (max 5).' },
  { id: 'demo', icon: '💣', name: 'Demolition', price: 5, desc: 'Bombs blast twice as far and give +3 mult.' },
  { id: 'sight', icon: '🔭', name: 'Long Sight', price: 4, desc: 'Full-length aim line, including the first bounce.' },
  { id: 'overtime', icon: '⏱️', name: 'Overtime', price: 4, desc: 'Unused shots pay 2 coins each instead of 1.' },
  { id: 'ghost', icon: '👻', name: 'Ghost Cue', price: 8, desc: 'The cue ball can never be potted.' },
  { id: 'power', icon: '💥', name: 'Power Break', price: 3, desc: '+30% max shot power.' },
  { id: 'rich', icon: '💎', name: 'Rich Rack', price: 5, desc: 'Far more gold, mult and bomb balls.' },
  { id: 'potluck', icon: '🍀', name: 'Pot Luck', price: 3, desc: '+25 chips on every scoring shot.' },
];
const BOSSES = [
  { id: 'shrink', name: 'The Squeeze', desc: 'Pockets are much smaller.' },
  { id: 'ice', name: 'Black Ice', desc: 'Almost no friction.' },
  { id: 'blind', name: 'Blindfold', desc: 'No aim line.' },
  { id: 'sticky', name: 'Dead Cushions', desc: 'Cushions barely bounce.' },
  { id: 'lockdown', name: 'Lockdown', desc: 'Two pockets are closed.' },
  { id: 'lead', name: 'Lead Balls', desc: 'Object balls are twice as heavy.' },
];

function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = key => mulberry32(hashStr('daily-break:' + key));
function shuffle(rnd, arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const isDailySeed = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Math.floor((Date.UTC(y, m - 1, d) - EPOCH) / 864e5) + 1;
}

function bossFor(seed, i) {
  if (i % 3 !== 2) return null;
  return shuffle(rngFor(seed + ':bosses'), BOSSES)[(i - 2) / 3];
}

const CUE_SPOT = { x: W / 2, y: H * 0.78 };

function clearOf(x, y, rad, objects, avoid) {
  return objects.every(o => Math.hypot(o.x - x, o.y - y) > (o.r ?? R) + rad + R * 1.5) &&
    POCKETS.every(p => Math.hypot(p.x - x, p.y - y) > rad + R * 4) &&
    Math.hypot(avoid.x - x, avoid.y - y) > rad + R * 3;
}

function makeLayout(seed, i, boss) {
  const rnd = rngFor(`${seed}:layout:${i}`);
  const closed = new Set();
  if (boss?.id === 'lockdown') shuffle(rnd, [0, 1, 2, 3, 4, 5]).slice(0, 2).forEach(p => closed.add(p));
  else if (rnd() < 0.2 + 0.04 * i) closed.add(Math.floor(rnd() * 6));
  const bumpers = [];
  const count = Math.min(4, Math.floor(rnd() * (2 + i * 0.35)));
  for (let n = 0; n < count; n++) {
    for (let k = 0; k < 200; k++) {
      const r = 16 + rnd() * 14, x = 90 + rnd() * (W - 180), y = 140 + rnd() * (H - 440);
      if (clearOf(x, y, r, bumpers, CUE_SPOT)) { bumpers.push({ x, y, r }); break; }
    }
  }
  return { closed, bumpers };
}

function makeRack(seed, i, rack, layout, cuePos, rich) {
  const rnd = rngFor(`${seed}:rack:${i}:${rack}`);
  const count = 7 + Math.floor(rnd() * 3);
  const numbers = shuffle(rnd, [1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, count);
  const chance = (rich ? 0.3 : 0.1) + 0.025 * i;
  const balls = [];
  for (const n of numbers) {
    const roll = rnd(), kind = rnd();
    const type = roll < chance ? (kind < 0.4 ? 'gold' : kind < 0.7 ? 'mult' : 'bomb') : 'normal';
    for (let k = 0; k < 500; k++) {
      const x = R * 2 + rnd() * (W - R * 4), y = R * 2 + rnd() * (H * 0.68 - R * 2);
      if (clearOf(x, y, R, [...layout.bumpers, ...balls], cuePos)) { balls.push({ x, y, n, type }); break; }
    }
  }
  return balls;
}

function shotScore(s, has) {
  if (!s || !s.pots.length) return { chips: 0, mult: 0, score: 0 };
  let chips = s.pots.reduce((sum, b) => sum + 10 + b.n * 10, 0);
  if (has('potluck')) chips += 25;
  if (has('bumper')) chips += 15 * s.bumperHits;
  let mult = 1 + (s.pots.length - 1) * (has('chain') ? 2 : 1) + s.banks * (has('bank') ? 2 : 1) + s.booms * (has('demo') ? 3 : 1);
  if (has('high')) mult += 3 * s.pots.filter(b => b.n >= 7).length;
  mult *= 2 ** s.multBalls;
  return { chips, mult, score: chips * mult };
}

class Table {
  constructor(run, i, onEvent = () => {}) {
    this.run = run; this.i = i; this.ev = onEvent;
    this.has = id => run.relics.includes(id);
    this.boss = bossFor(run.seed, i);
    this.layout = makeLayout(run.seed, i, this.boss);
    const b = this.boss?.id;
    this.p = {
      capMul: (this.has('wide') ? 1.25 : 1) * (b === 'shrink' ? 0.82 : 1),
      decel: b === 'ice' ? 70 : ROLL_DECEL,
      damp: b === 'ice' ? 0.08 : LIN_DAMP,
      cushionE: b === 'sticky' ? 0.4 : BASE_CUSHION_E,
      objMass: b === 'lead' ? 2 : 1,
      maxSpeed: BASE_MAX_SPEED * (this.has('power') ? 1.3 : 1),
      bombR: this.has('demo') ? 260 : 140,
    };
    this.cue = { x: CUE_SPOT.x, y: CUE_SPOT.y, vx: 0, vy: 0, n: 0, type: 'cue', m: this.has('heavy') ? 1.6 : 1, potted: false };
    this.rack = 0;
    this.loadRack();
    this.target = TARGETS[i];
    this.score = 0;
    this.shotsLeft = this.shotsMax = BASE_SHOTS + (this.has('chalk') ? 1 : 0);
    this.insuranceUsed = false;
    this.shot = null;
  }

  loadRack() {
    this.balls = makeRack(this.run.seed, this.i, this.rack, this.layout, this.cue, this.has('rich'))
      .map(b => ({ ...b, vx: 0, vy: 0, m: this.p.objMass, potted: false }));
  }

  openPocket(i) { return !this.layout.closed.has(i); }
  live() { return [this.cue, ...this.balls].filter(b => !b.potted); }
  moving() { return this.live().some(b => b.vx || b.vy); }

  shoot(dx, dy, power) {
    const speed = this.p.maxSpeed * power;
    this.cue.vx = dx * speed; this.cue.vy = dy * speed;
    this.shot = { pots: [], banks: 0, bumperHits: 0, booms: 0, multBalls: 0, scratch: false, coins: 0 };
    for (const b of this.balls) b.cushioned = false;
  }

  step() {
    const p = this.p, s = this.shot, live = this.live();
    for (const b of live) {
      if (this.has('magnet') && b !== this.cue) {
        POCKETS.forEach((pk, i) => {
          if (!this.openPocket(i)) return;
          const dx = pk.x - b.x, dy = pk.y - b.y, d = Math.hypot(dx, dy);
          if (d < 90 && d > 1) { const a = 1500 * (1 - d / 90) * DT / d; b.vx += dx * a; b.vy += dy * a; }
        });
      }
      b.x += b.vx * DT; b.y += b.vy * DT;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0) {
        const ns = Math.max(0, sp - (p.decel + p.damp * sp) * DT);
        const f = ns < STOP ? 0 : ns / sp;
        b.vx *= f; b.vy *= f;
      }
    }
    const bombs = new Set();
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, min = 2 * R;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, inv = 1 / a.m + 1 / b.m, ov = (min - d) / inv;
        a.x -= nx * ov / a.m; a.y -= ny * ov / a.m; b.x += nx * ov / b.m; b.y += ny * ov / b.m;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const jmp = -(1 + BALL_E) * vn / inv;
          a.vx -= jmp * nx / a.m; a.vy -= jmp * ny / a.m; b.vx += jmp * nx / b.m; b.vy += jmp * ny / b.m;
          this.ev('hit', { speed: -vn, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
          if (-vn > 120) { if (a.type === 'bomb') bombs.add(a); if (b.type === 'bomb') bombs.add(b); }
        }
      }
    }
    for (const bomb of bombs) this.explode(bomb);
    for (const b of live) {
      if (b.potted) continue;
      for (const o of this.layout.bumpers) {
        const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy), min = o.r + R;
        if (d >= min || d === 0) continue;
        const nx = dx / d, ny = dy / d;
        b.x = o.x + nx * min; b.y = o.y + ny * min;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= (1 + BUMPER_E) * vn * nx; b.vy -= (1 + BUMPER_E) * vn * ny;
          if (-vn > 40 && s) { s.bumperHits++; this.ev('bumper', { o, speed: -vn }); }
        }
      }
      const canPot = b !== this.cue || !this.has('ghost');
      const pocket = canPot ? POCKETS.findIndex((pk, i) => this.openPocket(i) && Math.hypot(b.x - pk.x, b.y - pk.y) < pk.cap * p.capMul) : -1;
      if (pocket >= 0) { this.pot(b, pocket); continue; }
      const sp = Math.hypot(b.vx, b.vy);
      let hitWall = false;
      if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx) * p.cushionE; hitWall = true; }
      if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx) * p.cushionE; hitWall = true; }
      if (b.y < R) { b.y = R; b.vy = Math.abs(b.vy) * p.cushionE; hitWall = true; }
      if (b.y > H - R) { b.y = H - R; b.vy = -Math.abs(b.vy) * p.cushionE; hitWall = true; }
      if (hitWall && sp > 30) { b.cushioned = true; this.ev('cushion', { speed: sp }); }
    }
  }

  pot(b, pocket) {
    const s = this.shot;
    this.ev('pot', { ball: b, pocket: POCKETS[pocket], x: b.x, y: b.y });
    b.potted = true; b.vx = b.vy = 0;
    if (!s) return;
    if (b === this.cue) { s.scratch = true; return; }
    s.pots.push(b);
    if (b.cushioned) s.banks++;
    if (b.type === 'mult') s.multBalls++;
    if (b.type === 'gold') {
      const coins = this.has('midas') ? 6 : 3;
      s.coins += coins; this.run.coins += coins;
      this.ev('coin', { x: POCKETS[pocket].x, y: POCKETS[pocket].y, coins });
    }
  }

  explode(bomb) {
    bomb.potted = true; bomb.vx = bomb.vy = 0;
    if (this.shot) this.shot.booms++;
    const rad = this.p.bombR;
    for (const b of this.live()) {
      const dx = b.x - bomb.x, dy = b.y - bomb.y, d = Math.hypot(dx, dy);
      if (d >= rad || d === 0) continue;
      const push = 1300 * (1 - d / rad) / b.m;
      b.vx += dx / d * push; b.vy += dy / d * push;
    }
    this.ev('boom', { x: bomb.x, y: bomb.y, r: rad });
  }

  respawnCue() {
    const free = (x, y) => x > R && x < W - R && y > R && y < H - R &&
      this.balls.every(b => b.potted || Math.hypot(b.x - x, b.y - y) > 2 * R + 2) &&
      this.layout.bumpers.every(o => Math.hypot(o.x - x, o.y - y) > o.r + R + 2);
    for (let rad = 0; rad < 500; rad += 4) {
      for (let a = 0; a < TAU; a += 0.3) {
        const x = CUE_SPOT.x + Math.cos(a) * rad, y = CUE_SPOT.y + Math.sin(a) * rad;
        if (free(x, y)) { Object.assign(this.cue, { x, y, vx: 0, vy: 0, potted: false }); return; }
      }
    }
  }

  endShot() {
    const s = this.shot;
    let { chips, mult, score } = shotScore(s, this.has);
    let scratch = null;
    if (s.scratch) {
      if (this.has('insurance') && !this.insuranceUsed) { this.insuranceUsed = true; scratch = 'insured'; }
      else { score = 0; scratch = 'scratch'; }
      this.respawnCue();
    }
    this.score += score; this.run.total += score; this.shotsLeft--; this.shot = null;
    let result = 'continue';
    if (this.score >= this.target) result = 'won';
    else if (this.balls.every(b => b.potted)) {
      if (this.shotsLeft > 0) { this.rack++; this.loadRack(); result = 'rerack'; } else result = 'lost';
    } else if (this.shotsLeft <= 0) result = 'lost';
    return { chips, mult, score, scratch, result, coins: s.coins };
  }

  trace(px, py, dx, dy) {
    const ray = (cx, cy, rad) => {
      const ox = px - cx, oy = py - cy, b = ox * dx + oy * dy, c = ox * ox + oy * oy - rad * rad, disc = b * b - c;
      if (disc < 0) return Infinity;
      const t = -b - Math.sqrt(disc);
      return t > 0.001 ? t : Infinity;
    };
    let best = { t: Infinity };
    for (const b of this.balls) {
      if (b.potted) continue;
      const t = ray(b.x, b.y, 2 * R);
      if (t < best.t) best = { t, ball: b };
    }
    for (const o of this.layout.bumpers) {
      const t = ray(o.x, o.y, o.r + R);
      if (t < best.t) best = { t, bumper: o };
    }
    const tx = dx > 0 ? (W - R - px) / dx : dx < 0 ? (R - px) / dx : Infinity;
    const ty = dy > 0 ? (H - R - py) / dy : dy < 0 ? (R - py) / dy : Infinity;
    if (Math.min(tx, ty) < best.t) best = { t: Math.min(tx, ty), wall: tx < ty ? 'x' : 'y' };
    return best;
  }

  rewards() {
    const base = 3 + (this.boss ? 2 : 0);
    const shots = this.shotsLeft * (this.has('overtime') ? 2 : 1);
    const interest = this.has('piggy') ? Math.min(5, Math.floor(this.run.coins / 5)) : 0;
    return { base, shots, interest, total: base + shots + interest };
  }
}

function shopOffers(run, i, rerolls) {
  const available = RELICS.filter(r => !run.relics.includes(r.id));
  return shuffle(rngFor(`${run.seed}:shop:${i}:${rerolls}`), available).slice(0, 3);
}

/* ----- sound ----- */

let audio = null, master, fxBus, verb, musicBus, noiseBuf, musicTimer = null, chordIdx = 0, lastHit = 0;
let muted = ls('dailybreak:muted') === '1', musicOn = ls('dailybreak:music') !== '0';

function ensureAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
    master = audio.createGain(); master.gain.value = muted ? 0 : 0.9;
    const comp = audio.createDynamicsCompressor();
    master.connect(comp).connect(audio.destination);
    fxBus = audio.createGain(); fxBus.connect(master);
    verb = audio.createGain(); verb.gain.value = 0.5;
    const delay = audio.createDelay(1), fb = audio.createGain(), lp = audio.createBiquadFilter();
    delay.delayTime.value = 0.23; fb.gain.value = 0.42; lp.type = 'lowpass'; lp.frequency.value = 2200;
    verb.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
    musicBus = audio.createGain(); musicBus.gain.value = musicOn ? 1 : 0;
    musicBus.connect(master); musicBus.connect(verb);
    noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  if (audio.state === 'suspended') audio.resume();
  if (!musicTimer) { playChord(); musicTimer = setInterval(playChord, 8000); }
}
function tone(freq, dur, vol, type = 'sine', slide = 1, delay = 0, wet = 0.15) {
  if (!audio) return;
  const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(fxBus);
  if (wet) { const w = audio.createGain(); w.gain.value = wet; g.connect(w).connect(verb); }
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, freq, type = 'lowpass', delay = 0, q = 0.7) {
  if (!audio) return;
  const t = audio.currentTime + delay, src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(Math.max(0.0002, vol), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(fxBus); src.start(t, Math.random() * 0.5, dur + 0.05);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
const sfx = {
  clack(v) { v = Math.min(1, v / 1600); if (v < 0.03) return; noise(0.03, 0.6 * v, 3200, 'bandpass', 0, 1.4); tone(2100 + Math.random() * 500, 0.045, 0.12 * v, 'sine', 1, 0, 0.05); },
  cushion(v) { v = Math.min(1, v / 2000); if (v < 0.03) return; noise(0.09, 0.35 * v, 380); tone(95, 0.12, 0.18 * v, 'sine', 0.7, 0, 0); },
  pot() { tone(170, 0.22, 0.35, 'sine', 0.5, 0, 0.1); noise(0.14, 0.25, 700, 'lowpass', 0.03); tone(1300, 0.025, 0.05, 'triangle', 1, 0.1, 0.1); tone(950, 0.025, 0.04, 'triangle', 1, 0.17, 0.1); },
  strike(p) { noise(0.02, 0.3 + 0.4 * p, 2400, 'bandpass', 0, 1); tone(820, 0.035, 0.08 + 0.1 * p, 'triangle', 1, 0, 0); },
  bumper() { tone(523, 0.25, 0.1, 'sine', 1.5, 0, 0.4); tone(784, 0.25, 0.06, 'sine', 1.5, 0.03, 0.4); },
  coin() { tone(1319, 0.12, 0.08, 'sine', 1, 0, 0.5); tone(1760, 0.3, 0.08, 'sine', 1, 0.08, 0.5); },
  boom() { noise(0.8, 0.55, 500); tone(70, 0.6, 0.4, 'sine', 0.5, 0, 0.2); },
  chime(n) { for (let k = 0; k < n; k++) tone(PENTA[Math.min(k, PENTA.length - 1)], 0.55, 0.07, 'sine', 1, k * 0.075, 0.6); },
  win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => { tone(f, 0.8, 0.09, 'triangle', 1, k * 0.11, 0.6); tone(f * 2, 0.6, 0.03, 'sine', 1, k * 0.11 + 0.02, 0.6); }); },
  lose() { [392, 329.63, 261.63].forEach((f, k) => tone(f, 0.8, 0.08, 'triangle', 1, k * 0.2, 0.6)); },
  buy() { tone(880, 0.12, 0.08, 'sine', 1, 0, 0.4); tone(1318.5, 0.35, 0.08, 'sine', 1, 0.07, 0.5); },
  click() { tone(660, 0.06, 0.05, 'sine', 1, 0, 0.2); },

const CHORDS = [[130.81, 164.81, 196, 246.94], [110, 130.81, 164.81, 196], [87.31, 130.81, 174.61, 220], [98, 146.83, 196, 246.94]];
function padNote(f, t, len) {
  const g = audio.createGain(), lp = audio.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.02, t + 2.5);
  g.gain.setValueAtTime(0.02, t + len - 3.5); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  for (const [type, det] of [['sine', 0], ['triangle', 5]]) {
    const o = audio.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
    o.connect(lp); o.start(t); o.stop(t + len + 0.1);
  }
  lp.connect(g).connect(musicBus);
}
function bell(f, t) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.025, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
  o.connect(g).connect(musicBus); o.start(t); o.stop(t + 2.5);
}
function playChord() {
  if (!audio || !musicOn || muted || document.hidden) return;
  const t = audio.currentTime + 0.05, chord = CHORDS[chordIdx++ % CHORDS.length];
  chord.forEach(f => padNote(f, t, 10));
  for (let k = 0; k < 3; k++) if (Math.random() < 0.7) bell(PENTA[Math.floor(Math.random() * 6)], t + 1 + Math.random() * 6);
}

/* ----- effects ----- */

function sparkle(x, y, color, n, speed = 120) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.3 + Math.random());
    fx.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.5, max: 1, color, r: 1.5 + Math.random() * 2 });
  }
}
function float(x, y, text, color, size = 22, life = 1.3) { fx.floats.push({ x, y, text, color, size, life, max: life }); }
function ring(x, y, color, grow = 60, life = 0.6, r = R) { fx.rings.push({ x, y, r, grow, life, max: life, color }); }

function onEvent(type, e) {
  if (type === 'hit') {
    if (audio && audio.currentTime - lastHit > 0.015) { lastHit = audio.currentTime; sfx.clack(e.speed); }
    if (e.speed > 700) sparkle(e.x, e.y, '#ffffff', 3, 80);
  } else if (type === 'cushion') sfx.cushion(e.speed);
  else if (type === 'bumper') { sfx.bumper(); e.o.flash = 1; ring(e.o.x, e.o.y, '255,210,122', 40, 0.5, e.o.r); }
  else if (type === 'pot') {
    sfx.pot(); buzz(12);
    const p = e.pocket, b = e.ball;
    const tx = clamp(p.x, 0, W), ty = clamp(p.y, 0, H);
    ensureSpin(b);
    fx.sinks.push({ x: e.x, y: e.y, tx, ty, b: { n: b.n, type: b.type, spot: b.spot, pole: b.pole }, t: 0 });
    ring(tx, ty, b.n > 0 ? '255,255,255' : '255,130,110', 55, 0.7);
    sparkle(tx, ty, b.n > 0 ? COLORS[b.n] : '#ff8a7a', 12, 140);
    const fxp = clamp(p.x, 55, W - 55), fyp = clamp(p.y, 40, H - 40) + (p.y < H / 2 ? 34 : -34);
    if (b.n > 0) float(fxp, fyp, `+${10 + b.n * 10}`, '#8fd0ff', 24);
    else float(fxp, fyp, 'Scratch', '#ff8a7a', 24);
  } else if (type === 'coin') {
    sfx.coin(); updateCoins();
    float(clamp(e.x, 50, W - 50), clamp(e.y, 70, H - 70) + (e.y < H / 2 ? 30 : -30), `+${e.coins} 🪙`, '#ffd700', 22);
  } else if (type === 'boom') {
    sfx.boom(); fx.shake = 10; buzz(40);
    ring(e.x, e.y, '255,140,90', e.r, 0.7, 10);
    sparkle(e.x, e.y, '#ff9a5a', 30, 420); sparkle(e.x, e.y, '#ffe08a', 16, 260);
    float(e.x, e.y - 20, 'BOOM +mult', '#ff8ad8', 28);
  }
}

/* ----- run flow ----- */

function newRun(seed, ranked) {
  run = { seed, ranked, coins: START_COINS, relics: [], total: 0, history: [] };
  if (ranked) {
    const saved = ls('dailybreak:run:' + seed);
    if (saved) { startTable(0); phase = 'over'; showRunOver(JSON.parse(saved), true); return; }
  }
  startTable(0);
}

function startTable(i) {
  table = new Table(run, i, onEvent);
  phase = 'aim'; drag = null; acc = 0; strike = null;
  shownScore = 0; shownText = '';
  fx.sinks = []; fx.petals = [];
  $('overlay').classList.remove('show');
  const tier = TIERS[i % 3];
  fx.banner = table.boss
    ? { title: `Boss: ${table.boss.name}`, sub: `${table.boss.desc} Target ${table.target}`, life: 3, boss: true }
    : { title: `Table ${i + 1}: ${tier}`, sub: `Score ${table.target} in ${table.shotsLeft} shots`, life: 2.4 };
  updateHud();
}

let shownScore = 0, shownText = '', lastCoins = null;
function updateCoins() {
  const el = $('coins');
  if (run.coins === lastCoins) return;
  el.textContent = run.coins;
  if (lastCoins !== null) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  lastCoins = run.coins;
}
function updateHud() {
  $('meta').textContent = isDailySeed(run.seed)
    ? `#${dayNumber(run.seed)} · ${run.seed}${run.ranked ? '' : ' (practice)'}`
    : `seed ${run.seed} (practice)`;
  $('tbl').textContent = `${table.i + 1}/${TABLES}`;
  $('tier').innerHTML = table.boss ? `<span class="boss">${table.boss.name}</span>` : TIERS[table.i % 3];
  $('shots').innerHTML = Array.from({ length: table.shotsMax }, (_, k) => `<i class="dot ${k < table.shotsLeft ? '' : 'used'}"></i>`).join('');
  updateCoins();
  $('relics').innerHTML = run.relics.map(id => {
    const r = RELICS.find(x => x.id === id);
    return `<span class="relic" title="${r.name}: ${r.desc}">${r.icon} ${r.name}</span>`;
  }).join('');
  updateLive();
}
function tickScore(dt) {
  if (!table) return;
  shownScore += (table.score - shownScore) * Math.min(1, dt * 5);
  if (Math.abs(table.score - shownScore) < 0.5) shownScore = table.score;
  const txt = `${Math.round(shownScore)} / ${table.target}`;
  if (txt !== shownText) {
    shownText = txt;
    $('progTxt').textContent = txt;
    $('progFill').style.width = Math.min(100, shownScore / table.target * 100) + '%';
  }
}
let liveText = '';
function updateLive() {
  const s = table.shot ? shotScore(table.shot, table.has) : null;
  const html = s && s.chips ? `<span class="c">${s.chips}</span> × <span class="m">${s.mult}</span>` : '–';
  if (html !== liveText) { liveText = html; $('live').innerHTML = html; }
}

function finishShot() {
  const s = table.shot, pots = s.pots.length, banks = s.banks;
  const out = table.endShot();
  const cy = H * 0.42;
  if (out.scratch === 'scratch') float(W / 2, cy, 'Scratch · shot scores 0', '#ff8a7a', 28, 1.8);
  else if (out.score > 0) {
    const big = out.score >= table.target * 0.4;
    float(W / 2, cy, `${out.chips} × ${out.mult} = ${out.score}`, big ? '#ffd27a' : '#ffffff', big ? 44 : 34, 1.9);
    const combo = pots >= 5 ? `${pots}-ball combo!` : ['', '', 'Double!', 'Triple!', 'Quadruple!'][pots];
    const extra = [combo, banks ? (banks > 1 ? `${banks} banks!` : 'Bank shot!') : ''].filter(Boolean).join('  ');
    if (extra) float(W / 2, cy - 50, extra, '#ff8ad8', 26, 1.9);
    if (out.scratch === 'insured') float(W / 2, cy + 46, 'Insurance used', '#b9c0d4', 20, 1.8);
    sfx.chime(Math.min(9, 1 + out.mult + pots));
    if (big) fx.zoom = 0.025;
  }
  updateHud();
  if (out.result === 'won') { phase = 'between'; celebrate(); setTimeout(winTable, 1700); }
  else if (out.result === 'lost') { phase = 'between'; setTimeout(loseRun, 1400); }
  else {
    phase = 'aim';
    if (out.result === 'rerack') fx.banner = { title: 'Re-rack!', sub: `${table.shotsLeft} shots to score ${table.target - table.score} more`, life: 2 };
  }
}

function winTable() {
  const rw = table.rewards();
  run.coins += rw.total;
  run.history.push({ i: table.i, won: true, boss: !!table.boss, score: table.score });
  if (table.i === TABLES - 1) { endRun(true); return; }
  shop = { i: table.i, rerolls: 0, rerollCost: 2, sold: new Set(), rewards: rw };
  phase = 'shop';
  renderShop();
}

function renderShop() {
  const offers = shopOffers(run, shop.i, shop.rerolls);
  const next = table.i + 1, nextBoss = bossFor(run.seed, next);
  const full = run.relics.length >= MAX_RELICS;
  const rw = shop.rewards;
  $('card').innerHTML = `
    <h2>Table ${table.i + 1} cleared</h2>
    <div class="rewards">Cleared +<b>${rw.base}</b> · unused shots +<b>${rw.shots}</b>${rw.interest ? ` · piggy bank +<b>${rw.interest}</b>` : ''} · you have <b>${run.coins}</b> 🪙</div>
    <div class="offers">${offers.map(r => {
      const sold = shop.sold.has(r.id);
      return `<div class="offer ${sold ? 'sold' : ''}"><div class="icon">${r.icon}</div><div class="name">${r.name}</div><div class="desc">${r.desc}</div>
        <button data-buy="${r.id}" ${sold || full || run.coins < r.price ? 'disabled' : ''}>${sold ? 'Owned' : `Buy ${r.price} 🪙`}</button></div>`;
    }).join('')}</div>
    ${full ? `<div class="meta">Relic slots full (${MAX_RELICS}).</div>` : ''}
    <div class="row">
      <button data-reroll ${run.coins < shop.rerollCost ? 'disabled' : ''}>Reroll ${shop.rerollCost} 🪙</button>
      <button class="primary" data-next>Next: table ${next + 1}${nextBoss ? ` · boss: ${nextBoss.name}` : ''}</button>
    </div>

}

function showHelp() {
  helpReturn = $('overlay').classList.contains('show') ? $('card').innerHTML : null;
  $('card').innerHTML = `
    <h2>How to play</h2>
    <div class="howto">
      <p>🎱 <b>Drag anywhere</b> and release to shoot. Pull back like a slingshot; the ring around the cue ball shows your power.</p>
      <p>🎯 Reach each table's <b>target score</b> before your shots run out.</p>
      <p>✨ Every shot scores <span class="c">chips</span> × <span class="m">mult</span>. Chips come from ball numbers. Mult grows with each extra ball in one shot, bank shots and bombs.</p>
      <p><b style="color:#ffd700">Gold</b> rings give coins · <b style="color:var(--mult)">pink</b> doubles the mult · <b style="color:#ff6b5b">red</b> explodes. Potting the cue ball scores nothing.</p>
      <p>🛍️ Spend coins on relics between tables. Every third table is a boss.</p>
      <p>📅 Everyone plays the same tables each day, with one ranked run per day.</p>
    </div>
    <div class="row"><button class="primary" data-close>Let's play</button></div>`;

$('card').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  ensureAudio();
  if (t.dataset.buy && phase === 'shop') {
    const r = RELICS.find(x => x.id === t.dataset.buy);
    if (run.coins >= r.price && run.relics.length < MAX_RELICS) {
      run.coins -= r.price; run.relics.push(r.id); shop.sold.add(r.id);
      sfx.buy(); renderShop();
    }
  } else if ('reroll' in t.dataset && phase === 'shop') {
    if (run.coins >= shop.rerollCost) { run.coins -= shop.rerollCost; shop.rerolls++; shop.rerollCost++; shop.sold.clear(); sfx.click(); renderShop(); }
  } else if ('next' in t.dataset) { sfx.click(); startTable(table.i + 1); }
  else if ('copy' in t.dataset) {
    navigator.clipboard?.writeText($('share').textContent);
    t.textContent = 'Copied!'; setTimeout(() => t.textContent = 'Copy result', 1200);
  } else if ('practice' in t.dataset) newRun(run.seed, false);
  else if ('random' in t.dataset) newRun(Math.random().toString(36).slice(2, 8), false);
  else if ('daily' in t.dataset) newRun(todayKey(), true);
  else if ('close' in t.dataset) {
    ls('dailybreak:seenHelp', '1'); sfx.click();
    if (helpReturn) { $('card').innerHTML = helpReturn; helpReturn = null; }
    else $('overlay').classList.remove('show');
  }
});

function loseRun() {
  run.history.push({ i: table.i, won: false, boss: !!table.boss, score: table.score });

    } else {
      const g = ctx.createRadialGradient(p.x, p.y, pr * 0.2, p.x, p.y, pr);
      g.addColorStop(0, '#000'); g.addColorStop(1, '#1d1611');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.fill();
      if (table.has('magnet')) {
        ctx.beginPath(); ctx.arc(p.x, p.y, 90, 0, TAU);
        ctx.strokeStyle = `rgba(143,208,255,${0.12 + 0.06 * Math.sin(t * 3)})`; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  });

  for (const o of table.layout.bumpers) {
    o.flash = Math.max(0, (o.flash || 0) - dt * 3);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(o.x + 2, o.y + 4, o.r, 0, TAU); ctx.fill();
    if (o.flash) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = o.flash * 0.7;
      ctx.drawImage(GLOW_GOLD, o.x - o.r * 2.5, o.y - o.r * 2.5, o.r * 5, o.r * 5); ctx.restore();
    }
    const g = ctx.createRadialGradient(o.x - o.r * 0.35, o.y - o.r * 0.4, 1, o.x, o.y, o.r);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#b9a27a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, o.r * (1 + o.flash * 0.08), 0, TAU); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,210,122,${0.7 + 0.3 * o.flash})`; ctx.stroke();
  }
}

function drawCue(shot, sk) {
  const cue = table.cue, gap = (6 + shot.power * 80) * (1 - sk) ** 2;
  const tip = R + 1 + gap, len = 400;
  ctx.save();
  ctx.translate(cue.x, cue.y); ctx.rotate(Math.atan2(shot.dy, shot.dx));
  const stick = (ox, oy) => {
    ctx.beginPath();
    ctx.moveTo(-tip + ox, -2.5 + oy); ctx.lineTo(-tip - len + ox, -5.5 + oy);
    ctx.lineTo(-tip - len + ox, 5.5 + oy); ctx.lineTo(-tip + ox, 2.5 + oy); ctx.closePath();
  };
  ctx.fillStyle = 'rgba(0,0,0,.25)'; stick(6, 9); ctx.fill();
  const g = ctx.createLinearGradient(-tip, 0, -tip - len, 0);
  g.addColorStop(0, '#f4e6c8'); g.addColorStop(0.6, '#d3a46c'); g.addColorStop(0.62, '#3b2418'); g.addColorStop(1, '#2a180f');
  ctx.fillStyle = g; stick(0, 0); ctx.fill();
  ctx.fillStyle = '#fbfaf5'; ctx.fillRect(-tip - 7, -2.6, 6, 5.2);
  ctx.fillStyle = '#4a7bd1'; ctx.fillRect(-tip - 1.5, -2.4, 2, 4.8);
  ctx.restore();
}

function drawAim(shot) {
  const cue = table.cue;
  const guide = table.boss?.id === 'blind' ? 0 : table.has('sight') ? Infinity : 320;
  if (guide > 0) {
    const hit = table.trace(cue.x, cue.y, shot.dx, shot.dy);
    const len = Math.min(hit.t, guide);
    const gx = cue.x + shot.dx * len, gy = cue.y + shot.dy * len;
    ctx.setLineDash([2, 9]); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cue.x, cue.y); ctx.lineTo(gx, gy); ctx.stroke(); ctx.setLineDash([]);
    if (hit.t <= guide) {
      ctx.beginPath(); ctx.arc(gx, gy, R, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; ctx.stroke();
      if (hit.ball) {
        const nx = hit.ball.x - gx, ny = hit.ball.y - gy, nl = Math.hypot(nx, ny), l = table.has('sight') ? 160 : 70;
        ctx.strokeStyle = hit.ball.n === 8 ? '#cfcfcf' : COLORS[hit.ball.n]; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(hit.ball.x, hit.ball.y); ctx.lineTo(hit.ball.x + nx / nl * l, hit.ball.y + ny / nl * l); ctx.stroke();
      } else if (hit.wall && table.has('sight')) {
        const rdx = hit.wall === 'x' ? -shot.dx : shot.dx, rdy = hit.wall === 'y' ? -shot.dy : shot.dy;
        const h2 = table.trace(gx, gy, rdx, rdy), l2 = Math.min(h2.t, 400);
        ctx.setLineDash([2, 9]); ctx.strokeStyle = 'rgba(255,255,255,.4)';
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + rdx * l2, gy + rdy * l2); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }
  const pc = shot.power > 0.85 ? '#ff8a6a' : '#ffd27a';
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cue.x, cue.y, R + 8, 0, TAU); ctx.stroke();
  ctx.strokeStyle = pc; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cue.x, cue.y, R + 8, -Math.PI / 2, -Math.PI / 2 + TAU * shot.power); ctx.stroke();
}

function draw(t, dt) {
  const s = canvas.width / (W + 2 * RAIL);
  fx.shake = Math.max(0, fx.shake - dt * 30);
  fx.zoom = Math.max(0, fx.zoom - dt * 0.08);
  const sx = (Math.random() - 0.5) * fx.shake, sy = (Math.random() - 0.5) * fx.shake, z = 1 + fx.zoom;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s * z, 0, 0, s * z, (RAIL + W / 2) * s - W / 2 * s * z + sx * s, (RAIL + H / 2) * s - H / 2 * s * z + sy * s);

  drawTable(t, dt);

  const live = table.live();
  for (const b of live) updateSpin(b, dt);
  ctx.lineCap = 'round';
  for (const b of live) {
    const tr = b._trail;
    if (!tr || tr.length < 2) continue;
    ctx.strokeStyle = b.n === 0 ? '#ffffff' : COLORS[b.n];
    for (let i = 1; i < tr.length; i++) {
      ctx.globalAlpha = 0.1 * i / tr.length; ctx.lineWidth = R * 1.6 * i / tr.length;
      ctx.beginPath(); ctx.moveTo(tr[i - 1][0], tr[i - 1][1]); ctx.lineTo(tr[i][0], tr[i][1]); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  for (const sk of fx.sinks) {
    sk.t += dt / 0.3;
    const e = Math.min(1, sk.t), k = e * e;
    drawBall(sk.b, lerp(sk.x, sk.tx, k), lerp(sk.y, sk.ty, k), t, 1 - 0.55 * k, 1 - k);
  }
  fx.sinks = fx.sinks.filter(sk => sk.t < 1);

  const shot = phase === 'aim' && drag ? dragShot() : phase === 'strike' ? strike.shot : null;
  if (shot && phase === 'aim') drawAim(shot);

  for (const b of table.balls) if (!b.potted) drawBall(b, b.x, b.y, t);
  if (!table.cue.potted) drawBall(table.cue, table.cue.x, table.cue.y, t);
  if (shot) drawCue(shot, phase === 'strike' ? Math.min(1, strike.t / STRIKE_T) : 0);

  for (const g of fx.rings) {
    g.life -= dt;
    const k = Math.max(0, g.life / g.max);
    ctx.strokeStyle = `rgba(${g.color},${k * 0.6})`; ctx.lineWidth = 2 + 3 * k;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r + g.grow * (1 - k), 0, TAU); ctx.stroke();
  }
  fx.rings = fx.rings.filter(g => g.life > 0);

  ctx.globalCompositeOperation = 'lighter';
  for (const p of fx.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93; p.vy -= 10 * dt; p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  fx.particles = fx.particles.filter(p => p.life > 0);
  ctx.globalAlpha = 1;

  for (const p of fx.petals) {
    p.life -= dt; p.y += p.vy * dt; p.x += p.vx * dt + Math.sin(p.y * 0.02 + p.p) * 0.6; p.rot += p.vr * dt;
    ctx.globalAlpha = Math.min(1, p.life) * 0.9; ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  fx.petals = fx.petals.filter(p => p.life > 0 && p.y < H + 30);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of fx.floats) {
    f.life -= dt; f.y -= 28 * dt;
    const k = f.life / f.max, pop = k > 0.85 ? 1 + (k - 0.85) * 2.2 : 1;
    ctx.globalAlpha = Math.min(1, k * 2.5);
    ctx.font = `900 ${f.size * pop}px Nunito, system-ui`;
    ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(10,14,30,.7)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  fx.floats = fx.floats.filter(f => f.life > 0);
  ctx.globalAlpha = 1;

  if (fx.banner) {
    const b = fx.banner;
    b.life -= dt;
    const k = Math.min(1, b.life * 2), slide = (1 - Math.min(1, (b.max ?? (b.max = b.life)) - b.life) * 4) ;
    ctx.globalAlpha = k;
    ctx.save(); ctx.translate(0, Math.max(0, slide) * 20);
    ctx.fillStyle = 'rgba(15,20,40,.62)';
    ctx.beginPath(); ctx.roundRect(W * 0.05, H * 0.42 - 58, W * 0.9, 116, 26); ctx.fill();
    ctx.font = '900 34px Nunito, system-ui'; ctx.fillStyle = b.boss ? '#ff9a7a' : '#ffd27a';
    ctx.fillText(b.title, W / 2, H * 0.42 - 14);
    ctx.font = '700 17px Nunito, system-ui'; ctx.fillStyle = '#e9efe9';
    ctx.fillText(b.sub, W / 2, H * 0.42 + 24);
    ctx.restore();
    ctx.globalAlpha = 1;
    if (b.life <= 0) fx.banner = null;
  }
}

function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, t - (frame.last ?? t));
  frame.last = t;
  if (phase === 'strike') {
    strike.t += dt;
    if (strike.t >= STRIKE_T) {
      const s = strike.shot;
      table.shoot(s.dx, s.dy, s.power);
      sfx.strike(s.power); buzz(8);
      acc = 0; phase = 'moving';
    }
  }
  if (phase === 'moving') {
    acc += dt;
    while (acc >= DT) { table.step(); acc -= DT; }
    updateLive();
    if (!table.moving()) { strike = null; finishShot(); }
  }
  tickScore(dt);
  draw(t, dt);
  drawBg(t, dt);
  requestAnimationFrame(frame);
}

const seedParam = new URLSearchParams(location.search).get('seed');
resize();
newRun(seedParam || todayKey(), !seedParam);
if (!ls('dailybreak:seenHelp') && !$('overlay').classList.contains('show')) showHelp();
requestAnimationFrame(frame);
</script>
</body>
</html>
