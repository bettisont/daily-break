<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece5d3">
<title>Daily Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ece5d3;--panel:#f5f0e4;--card:#fbf8f0;--ink:#2d3a30;--muted:#7d8577;--line:#d9d0bb;--green:#2f6b4f;--green-dark:#1f4a36;--hi:#dde7d0;--gold:#b88a2e;--red:#b8553f;--hatch:#e8bcb0}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.35 'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  header,#card9,#info,#controls{width:min(100%,640px);margin-inline:auto}
  #card9,#info{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  @media (max-width:640px){ #card9,#info{border-left:0;border-right:0} }
  .mono{font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.14em}
  header{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 16px}
  header .titles{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;flex:1;min-width:0}
  .btns{display:flex;gap:6px}
  h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
  #course{font-size:12px;color:var(--muted)}
  #card9{display:grid;grid-template-columns:repeat(9,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
  #card9 .c{border-left:1px solid var(--line);text-align:center;font-family:'DM Mono',monospace;font-size:12px;line-height:1.2;transition:background .3s}
  #card9 .c:first-child{border-left:0}
  #card9 .c.cur{background:var(--hi)}
  #card9 .n{padding-top:4px;color:var(--ink)}
  #card9 .m{color:var(--muted);height:17px;line-height:17px}
  #card9 .p{color:var(--muted);border-top:1px solid var(--line);padding:3px 0 4px}
  .m .sc{display:inline-block;min-width:17px;height:17px;line-height:15px;border:1px solid transparent;color:var(--ink);font-weight:500}
  .m .sc.b1{border-color:#3d7f57;border-radius:50%;color:#2f6b4f}
  .m .sc.b2{border-color:var(--gold);border-radius:50%;color:var(--gold);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--gold)}
  .m .sc.o1{border-color:var(--red);color:var(--red)}
  .m .sc.o2{border-color:var(--red);color:var(--red);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--red)}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:crosshair}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #info{display:grid;grid-template-columns:1.6fr 1fr 1fr;border-bottom:1px solid var(--line);background:var(--paper)}
  #info > div{padding:6px 12px 7px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:#5a6556;white-space:nowrap;overflow:hidden}
  #info > div + div{border-left:1px solid var(--line)}
  #info b{display:block;margin-top:2px;font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:-.01em;text-transform:none;font-size:18px;color:var(--ink);line-height:1.1}
  #info b small{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#5a6556;font-weight:400;margin-left:4px}
  .round{width:34px;height:34px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px rgba(60,45,25,.16);font:600 15px 'DM Sans',sans-serif;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
  .round.off{opacity:.45}
  #controls{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
  #meter{position:relative;height:26px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
  #mOver{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(-45deg,var(--hatch) 0 7px,transparent 7px 14px)}
  #mFill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#eef2e6,#9fc495)}
  #mPin{position:absolute;top:0;bottom:0;background:rgba(226,177,60,.35);border-left:2px solid var(--gold);border-right:2px solid var(--gold);transition:background .15s}
  #meter.hit #mPin{background:rgba(226,177,60,.85)}
  #mNeedle{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:var(--ink);opacity:0}
  .mlabels{position:relative;height:15px;margin:5px 2px 8px;font-size:11px;color:var(--muted)}
  .mlabels span{position:absolute;top:0}
  #lEase{left:0} #lOver{right:0} #lPin{transform:translateX(-50%)}
  .actrow{display:flex;gap:8px;align-items:stretch}
  .nudge{width:46px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 20px 'DM Sans',sans-serif;cursor:pointer;touch-action:none;transition:opacity .2s}
  .nudge:disabled{opacity:.3;cursor:default}
  #act{flex:1;min-width:0;height:50px;touch-action:none;border:0;border-radius:14px;background:var(--green);color:#f4f6ef;font:800 20px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--green-dark);transition:transform .08s,box-shadow .08s,background .2s}
  #act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--green-dark)}
  #act:disabled{opacity:.5;cursor:default}
  #act.stop{background:#b5603f;box-shadow:0 3px 0 #7d3f28}
  #hint{margin-top:8px;text-align:center;font-size:11px;color:var(--muted);min-height:14px}
  #overlay{position:fixed;inset:0;z-index:10;background:rgba(236,229,211,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .3s}
  #overlay.show{opacity:1;pointer-events:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(60,45,25,.18);max-width:440px;width:100%;padding:22px;text-align:center;margin:auto;transform:translateY(12px);transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}
  #overlay.show .card{transform:none}
  .card h2{margin:4px 0 6px;font-size:24px;font-weight:800}
  .card .k{font-size:11px;color:var(--muted)}
  .card .big{font-size:54px;font-weight:800;line-height:1;margin:8px 0 2px}
  .howto{text-align:left;font-size:14px;color:#4c574a}
  .howto p{margin:9px 0}
  .howto b{color:var(--ink)}
  .mini{display:grid;grid-template-columns:auto repeat(9,1fr) auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0;font-family:'DM Mono',monospace;font-size:12px}
  .mini div{padding:5px 0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .mini div.h{padding:5px 6px;color:var(--muted);border-left:0}
  .mini div.t{padding:5px 6px}
  .mini div.r0{border-top:0}
  #share{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;text-align:left;margin:12px auto;max-width:300px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}
  .btn.primary{background:var(--green);border-color:var(--green);color:#f4f6ef}
  @media (max-width:420px){ h1{font-size:20px} #course{font-size:10px;letter-spacing:.1em} header{padding:8px 10px 6px 14px} #info b{font-size:16px} #info > div{padding:6px 9px 7px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titles"><h1>Daily Break</h1><span class="mono" id="course"></span></div>
    <div class="btns">
      <button class="round" id="snd" title="Sound">🔊</button>
      <button class="round" id="mus" title="Music">♫</button>
      <button class="round" id="help" title="How to play">?</button>
    </div>
  </header>
  <div id="card9"></div>
  <div id="info"><div id="iHole"></div><div id="iLie"></div><div id="iTilt"></div></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls">
    <div id="meter"><div id="mFill"></div><div id="mOver"></div><div id="mPin"></div><div id="mNeedle"></div></div>
    <div class="mlabels mono"><span id="lEase">Ease</span><span id="lPin">Pin</span><span id="lOver">Over</span></div>
    <div class="actrow"><button class="nudge" id="nL" title="Fine aim (← key)">‹</button><button id="act">Lock the line</button><button class="nudge" id="nR" title="Fine aim (→ key)">›</button></div>
    <div id="hint" class="mono"></div>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
/* =================== core: holes, physics, solver (no DOM) =================== */

const W = 500, H = 1000, RAIL = 40, R = 17, DT = 1 / 240, TAU = Math.PI * 2;
const MAX_SPEED = 2600, ROLL_DECEL = 240, LIN_DAMP = 0.32, STOP = 6;
const BALL_E = 0.95, BUMPER_E = 0.9, CUSHION_E = 0.78, POT_MAX_SPEED = 1500, ARRIVE = 160;
const HOLES = 9, PX_PER_IN = 10, EPOCH = Date.UTC(2026, 10, 9);
const COLORS = ['#f4efe2', '#e2b13c', '#3b5ea6', '#c4472f', '#6a4b8c', '#dc7a30', '#3d8758', '#86372b', '#24221f', '#e2b13c'];
const POCKETS = [
  { x: 0, y: 0, cap: R * 2.0 }, { x: W, y: 0, cap: R * 2.0 },
  { x: -5, y: H / 2, cap: R * 1.8 }, { x: W + 5, y: H / 2, cap: R * 1.8 },
  { x: 0, y: H, cap: R * 2.0 }, { x: W, y: H, cap: R * 2.0 },
];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = key => mulberry32(hashStr('daily-break:' + key));
function shuffle(rnd, arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const isDailySeed = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Math.floor((Date.UTC(y, m - 1, d) - EPOCH) / 864e5) + 1;
}

const NAME_A = ['Velvet', 'Brass', 'Juniper', 'Amber', 'Willow', 'Copper', 'Moss', 'Ivory', 'Saffron', 'Linden', 'Hazel', 'Marigold'];
const NAME_B = ['Room', 'Parlour', 'Hall', 'Lounge', 'Club', 'Den', 'House', 'Rooms'];
function courseName(seed) {
  const r = rngFor(seed + ':name');
  return `${NAME_A[Math.floor(r() * NAME_A.length)]} ${NAME_B[Math.floor(r() * NAME_B.length)]}`;
}

// Where a ball must travel to drop in pocket i (just inside the mouth).
function pocketAim(i) {
  const p = POCKETS[i];
  return { x: p.x <= 0 ? R + 1 : p.x >= W ? W - R - 1 : p.x, y: p.y <= 0 ? R + 1 : p.y >= H ? H - R - 1 : p.y };
}
function inPatch(p, x, y) {
  const c = Math.cos(-p.rot), s = Math.sin(-p.rot), dx = x - p.x, dy = y - p.y;
  const lx = dx * c - dy * s, ly = dx * s + dy * c;
  return (lx / p.rx) ** 2 + (ly / p.ry) ** 2 < 1;
}
function lieAt(hole, x, y) {
  for (const p of hole.patches) if (inPatch(p, x, y)) return p.type;
  return 'felt';
}

// A hole: get the target ball into the flagged pocket. Everything is seeded by date + hole number.
function makeHole(seed, i) {
  const rnd = rngFor(`${seed}:hole:${i}`);
  const flag = Math.floor(rnd() * 6), F = pocketAim(flag);
  const closed = [];
  if (rnd() < 0.12 + i * 0.05) closed.push(...shuffle(rnd, [0, 1, 2, 3, 4, 5]).filter(p => p !== flag).slice(0, rnd() < 0.35 ? 2 : 1));
  const placed = [];
  const ok = (x, y, rad, gap) => x > rad + 6 && x < W - rad - 6 && y > rad + 6 && y < H - rad - 6 &&
    placed.every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + gap) &&
    POCKETS.every(p => Math.hypot(p.x - x, p.y - y) > rad + R * 3.2);
  const place = (gen, rad, gap, extra = () => true) => {
    for (let k = 0; k < 500; k++) {
      const [x, y] = gen();
      if (ok(x, y, rad, gap) && extra(x, y)) { const o = { x, y, r: rad }; placed.push(o); return o; }
    }
    return null;
  };
  const reach = 260 + i * 55;
  const target = place(() => { const a = rnd() * TAU, d = 150 + rnd() * reach; return [F.x + Math.cos(a) * d, F.y + Math.sin(a) * d]; }, R, R)
    || place(() => [W / 2, H / 2], R, 0);
  const cue = place(() => [40 + rnd() * (W - 80), 40 + rnd() * (H - 80)], R, R * 2,
    (x, y) => { const d = Math.hypot(x - target.x, y - target.y); return d > 220 && d < 260 + i * 60; })
    || place(() => [40 + rnd() * (W - 80), 40 + rnd() * (H - 80)], R, R * 2) || { x: W / 2, y: H * 0.85 };
  const bumpers = [];
  const nBump = rnd() < 0.22 + i * 0.07 ? 1 + Math.floor(rnd() * 2) : 0;
  for (let k = 0; k < nBump; k++) {
    const o = place(() => [90 + rnd() * (W - 180), 120 + rnd() * (H - 240)], 18 + rnd() * 12, R * 1.5);
    if (o) bumpers.push({ x: o.x, y: o.y, r: o.r });
  }
  const nums = shuffle(rnd, [1, 2, 3, 4, 5, 6, 7, 8, 9]);
  const balls = [{ x: target.x, y: target.y, n: nums[0], target: true }];
  const nBlock = Math.min(7, Math.floor(rnd() * 2 + i * 0.75));
  for (let k = 0; k < nBlock; k++) {
    const onLine = rnd() < 0.3 + i * 0.05;
    const o = place(() => {
      if (!onLine) return [30 + rnd() * (W - 60), 30 + rnd() * (H - 60)];
      // in the way of the cue, or narrowing (never shutting) the target's lane to the pocket
      const lane = rnd() < 0.5, [ax, ay, bx, by] = lane ? [target.x, target.y, F.x, F.y] : [cue.x, cue.y, target.x, target.y];
      const u = 0.3 + rnd() * 0.4, L = Math.hypot(bx - ax, by - ay) || 1;
      const off = lane ? (rnd() < 0.5 ? -1 : 1) * R * (2.15 + rnd()) : (rnd() - 0.5) * R * 3;
      return [ax + (bx - ax) * u - (by - ay) / L * off, ay + (by - ay) * u + (bx - ax) / L * off];
    }, R, R * 0.6);
    if (o) balls.push({ x: o.x, y: o.y, n: nums[balls.length] });
  }
  const patches = [];
  const nPatch = rnd() < 0.35 + i * 0.05 ? 1 + (rnd() < 0.3 ? 1 : 0) : 0;
  for (let k = 0; k < nPatch; k++) {
    patches.push({ type: rnd() < 0.6 ? 'rough' : 'slick', x: 70 + rnd() * (W - 140), y: 90 + rnd() * (H - 180), rx: 60 + rnd() * 70, ry: 45 + rnd() * 50, rot: rnd() * Math.PI, seed: Math.floor(rnd() * 1e6) });
  }
  let tilt = { x: 0, y: 0, mag: 0, dir: 0 };
  if (rnd() < 0.28 + i * 0.06) {
    const dir = Math.floor(rnd() * 8), mag = 12 + rnd() * (14 + i * 4), a = dir * Math.PI / 4;
    tilt = { x: Math.cos(a) * mag, y: Math.sin(a) * mag, mag, dir };
  }
  return { i, seed, flag, closed, cue: { x: cue.x, y: cue.y }, balls, bumpers, patches, tilt, par: null };
}

class Table {
  constructor(hole, onEvent = () => {}) {
    this.hole = hole; this.ev = onEvent;
    this.cue = { x: hole.cue.x, y: hole.cue.y, vx: 0, vy: 0, n: 0, m: 1, potted: false, isCue: true };
    this.balls = hole.balls.map(b => ({ ...b, vx: 0, vy: 0, m: 1, potted: false }));
    this.target = this.balls[0];
    this.shot = null;
  }
  openPocket(i) { return !this.hole.closed.includes(i); }
  live() { return [this.cue, ...this.balls].filter(b => !b.potted); }
  moving() { return this.live().some(b => b.vx || b.vy); }

  shoot(angle, power) {
    const sp = MAX_SPEED * power;
    this.cue.vx = Math.cos(angle) * sp; this.cue.vy = Math.sin(angle) * sp;
    this.shot = { pots: [], targetPocket: -1, scratch: false, rattles: 0, cushions: 0 };
  }

  step() {
    const live = this.live(), tl = this.hole.tilt, s = this.shot;
    for (const b of live) {
      if (b.vx || b.vy) { b.vx += tl.x * DT; b.vy += tl.y * DT; }
      b.x += b.vx * DT; b.y += b.vy * DT;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0) {
        const lie = this.hole.patches.length ? lieAt(this.hole, b.x, b.y) : 'felt';
        const fd = lie === 'rough' ? 3.2 : lie === 'slick' ? 0.3 : 1, fk = lie === 'rough' ? 1.6 : lie === 'slick' ? 0.4 : 1;
        const ns = Math.max(0, sp - (ROLL_DECEL * fd + LIN_DAMP * fk * sp) * DT);
        const f = ns < STOP ? 0 : ns / sp;
        b.vx *= f; b.vy *= f;
      }
    }
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, min = 2 * R;
        if (d2 >= min * min || d2 === 0) continue;
        // rewind to the exact moment of contact so the collision normal is precise
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy, dv = dx * rvx + dy * rvy, vv = rvx * rvx + rvy * rvy;
        const back = dv < 0 && vv > 0 ? Math.min(DT * 2, (dv + Math.sqrt(dv * dv - vv * (d2 - min * min))) / vv) : 0;
        a.x -= a.vx * back; a.y -= a.vy * back; b.x -= b.vx * back; b.y -= b.vy * back;
        const ex = b.x - a.x, ey = b.y - a.y, d = Math.hypot(ex, ey) || 1, nx = ex / d, ny = ey / d, inv = 1 / a.m + 1 / b.m;
        if (d < min) { const ov = (min - d) / inv; a.x -= nx * ov / a.m; a.y -= ny * ov / a.m; b.x += nx * ov / b.m; b.y += ny * ov / b.m; }
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const jmp = -(1 + BALL_E) * vn / inv;
          a.vx -= jmp * nx / a.m; a.vy -= jmp * ny / a.m; b.vx += jmp * nx / b.m; b.vy += jmp * ny / b.m;
          this.ev('hit', { speed: -vn, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        }
        a.x += a.vx * back; a.y += a.vy * back; b.x += b.vx * back; b.y += b.vy * back;
      }
    }
    for (const b of live) {
      if (b.potted) continue;
      for (const o of this.hole.bumpers) {
        const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy), min = o.r + R;
        if (d >= min || d === 0) continue;
        const nx = dx / d, ny = dy / d;
        b.x = o.x + nx * min; b.y = o.y + ny * min;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= (1 + BUMPER_E) * vn * nx; b.vy -= (1 + BUMPER_E) * vn * ny; if (-vn > 40) this.ev('bumper', { o, speed: -vn }); }
      }
      let potted = false;
      for (let i = 0; i < 6 && !potted; i++) {
        if (!this.openPocket(i)) continue;
        const pk = POCKETS[i], dx = b.x - pk.x, dy = b.y - pk.y, d = Math.hypot(dx, dy);
        if (d >= pk.cap) continue;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > POT_MAX_SPEED) {
          // too hot: it rattles in the jaws and spits back out
          const nx = dx / (d || 1), ny = dy / (d || 1), vn = b.vx * nx + b.vy * ny;
          if (vn < 0) { b.vx = (b.vx - 2 * vn * nx) * 0.4; b.vy = (b.vy - 2 * vn * ny) * 0.4; }

// Aim lines worth snapping to: the pot line for the target into the flag, and one-cushion banks.
function computeSnaps() {

  flagPop = Math.max(0, flagPop - dt);
  const lift = 46 + flagPop * 24, lean = x < W / 2 ? 1 : -1;
  const topX = x + lean * 10, topY = y - lift;
  ctx.strokeStyle = 'rgba(40,25,10,.3)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + lean * 26 + 12, y + 14); ctx.stroke();
  ctx.strokeStyle = '#efe4ca'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(topX, topY); ctx.stroke();
  const wv = Math.sin(t * 5) * 4, wv2 = Math.sin(t * 5 + 1.4) * 3;
  ctx.fillStyle = '#c4472f';
  ctx.beginPath(); ctx.moveTo(topX, topY); ctx.quadraticCurveTo(topX + lean * 14, topY + 2 + wv, topX + lean * 28, topY + 8 + wv2); ctx.lineTo(topX, topY + 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#efe4ca'; ctx.beginPath(); ctx.arc(topX, topY, 2.5, 0, TAU); ctx.fill();
}

function drawAim() {
  const c = table.cue;
  const angle = phase === 'aim' ? aim.angle + (drag ? 0 : aimOffset()) : locked.angle;
  // snap points round the cue ball
  if (phase === 'aim') for (const sn of snaps) {
    const on = aim.snap === sn;
    ctx.fillStyle = sn.kind === 'pot' ? (on ? '#e2b13c' : 'rgba(226,177,60,.75)') : (on ? '#fbf8f0' : 'rgba(251,248,240,.6)');
    ctx.beginPath(); ctx.arc(c.x + Math.cos(sn.angle) * (R + 24), c.y + Math.sin(sn.angle) * (R + 24), on ? 4.5 : 3, 0, TAU); ctx.fill();
  }
  ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(255,250,235,.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(aim.x, aim.y); ctx.stroke(); ctx.setLineDash([]);
  const dx = Math.cos(angle), dy = Math.sin(angle), hit = trace(table, c.x, c.y, dx, dy), L = Math.min(hit.t, aim.dist);
  const col = phase !== 'aim' ? '#d08a2e' : aim.snap ? '#e2b13c' : '#c4472f';
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(c.x + dx * R, c.y + dy * R); ctx.lineTo(c.x + dx * L, c.y + dy * L); ctx.stroke();
  if (hit.ball && hit.t <= aim.dist + 2 * R) {
    const gx = c.x + dx * hit.t, gy = c.y + dy * hit.t, b = hit.ball, nx = (b.x - gx) / (2 * R), ny = (b.y - gy) / (2 * R);
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(gx, gy, R, 0, TAU); ctx.stroke();
    ctx.setLineDash([3, 6]); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(b.x + nx * R, b.y + ny * R); ctx.lineTo(b.x + nx * 110, b.y + ny * 110); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#2d3a30'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(aim.x, aim.y, 11, 0, TAU); ctx.moveTo(aim.x - 17, aim.y); ctx.lineTo(aim.x + 17, aim.y); ctx.moveTo(aim.x, aim.y - 17); ctx.lineTo(aim.x, aim.y + 17); ctx.stroke();
  const label = phase === 'aim' && aim.snap ? (aim.snap.kind === 'pot' ? 'Pot line' : 'Bank line') : `${Math.round(aim.dist / PX_PER_IN)} in`;
  ctx.font = "500 14px 'DM Mono', monospace"; const tw = ctx.measureText(label).width;
  const lx = aim.x + 24 + tw > W + RAIL ? aim.x - 24 - tw - 18 : aim.x + 24, ly = aim.y - 30;
  ctx.fillStyle = 'rgba(251,248,240,.95)'; ctx.strokeStyle = 'rgba(120,100,70,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(lx, ly, tw + 18, 24, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2d3a30'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, lx + 9, ly + 12.5);
}

function drawCue(angle, pull, sk) {
  const c = table.cue, gap = (6 + pull * 80) * (1 - sk) ** 2, tip = R + 2 + gap, len = 420;
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(angle);
  const stick = (ox, oy) => { ctx.beginPath(); ctx.moveTo(-tip + ox, -3 + oy); ctx.lineTo(-tip - len + ox, -6.5 + oy); ctx.lineTo(-tip - len + ox, 6.5 + oy); ctx.lineTo(-tip + ox, 3 + oy); ctx.closePath(); };
  ctx.fillStyle = 'rgba(40,25,10,.22)'; stick(8, 12); ctx.fill();
  const g = ctx.createLinearGradient(-tip, 0, -tip - len, 0);
  g.addColorStop(0, '#f1e3c4'); g.addColorStop(0.58, '#d6a86e'); g.addColorStop(0.6, '#3b2418'); g.addColorStop(0.75, '#c4472f'); g.addColorStop(0.77, '#2a180f'); g.addColorStop(1, '#2a180f');
  ctx.fillStyle = g; stick(0, 0); ctx.fill();
  ctx.fillStyle = '#fbf8f0'; ctx.fillRect(-tip - 8, -3.1, 7, 6.2);
  ctx.fillStyle = '#3b5ea6'; ctx.fillRect(-tip - 1.5, -2.9, 2, 5.8);
  ctx.restore();
}

function drawStamp(dt) {
  if (!stamp) return;
  stamp.t += dt;
  const k = Math.min(1, stamp.t / 0.35), e = 1 + 1.7 * (1 - k) ** 3, a = Math.min(1, stamp.t * 4);
  ctx.save(); ctx.translate(W / 2, H * 0.42); ctx.rotate(-0.12); ctx.scale(e, e); ctx.globalAlpha = a;
  const text = stamp.text.toUpperCase();
  let size = 46; ctx.font = `800 ${size}px 'DM Sans', sans-serif`;
  while (ctx.measureText(text).width > W * 0.72 && size > 24) { size -= 2; ctx.font = `800 ${size}px 'DM Sans', sans-serif`; }
  const tw = ctx.measureText(text).width + 50;
  ctx.fillStyle = 'rgba(251,248,240,.92)'; ctx.beginPath(); ctx.roundRect(-tw / 2, -46, tw, 92, 14); ctx.fill();
  ctx.strokeStyle = stamp.color; ctx.lineWidth = 5; ctx.stroke();
  ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(-tw / 2 + 7, -39, tw - 14, 78, 9); ctx.stroke();
  ctx.fillStyle = stamp.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, -6);
  ctx.font = "500 14px 'DM Mono', monospace"; ctx.fillText(stamp.sub.toUpperCase(), 0, 26);
  ctx.restore();
}

function drawBanner(dt) {
  if (!banner) return;
  banner.life -= dt;
  const a = Math.min(1, banner.life * 2, (banner.max - banner.life) * 4);
  ctx.save(); ctx.globalAlpha = Math.max(0, a);
  ctx.fillStyle = 'rgba(251,248,240,.93)'; ctx.strokeStyle = 'rgba(120,100,70,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(W * 0.08, H * 0.42 - 54, W * 0.84, 108, 16); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#2d3a30';
  ctx.font = "800 40px 'DM Sans', sans-serif"; ctx.fillText(banner.title, W / 2, H * 0.42 - 12);
  ctx.font = "500 14px 'DM Mono', monospace"; ctx.fillStyle = '#6d7568'; ctx.fillText(banner.sub.toUpperCase(), W / 2, H * 0.42 + 26);
  ctx.restore();
  if (banner.life <= 0) banner = null;
}

function draw(t, dt) {
  const { s, dpr, cw, ch, ox, oy } = view;
  fx.shake = Math.max(0, fx.shake - dt * 25);
  const sx = (Math.random() - 0.5) * fx.shake, sy = (Math.random() - 0.5) * fx.shake;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#d8c29b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, (ox + sx) * dpr, (oy + sy) * dpr);
  const x0 = -ox / s - 20, y0 = -oy / s - 20, x1 = (cw - ox) / s + 20, y1 = (ch - oy) / s + 20;

  drawFloor(x0, y0, x1, y1);
  drawWindowLight(t);
  drawRug();
  drawChair();
  drawRecord(dt);
  drawCat(t);
  drawTable(t, dt);

  for (const tr of trails) {
    ctx.fillStyle = `rgba(255,250,235,${tr === curTrail ? 0.85 : 0.35})`;
    for (const [x, y] of tr.pts) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, TAU); ctx.fill(); }
  }
  for (const m of marks) {
    ctx.fillStyle = '#fbf8f0'; ctx.strokeStyle = '#2d3a30'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(m.x, m.y, 9, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2d3a30'; ctx.font = "500 11px 'DM Mono', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(m.n, m.x, m.y + 0.5);
  }

  if (phase === 'aim' || phase === 'locked' || phase === 'power') drawAim();

  for (const b of table.live()) updateSpin(b, dt);
  for (const sk of fx.sinks) {
    sk.t += dt / 0.3;
    const k = Math.min(1, sk.t) ** 2;
    drawBall(sk.b, lerp(sk.x, sk.tx, k), lerp(sk.y, sk.ty, k), 1 - 0.55 * k, 1 - k);
  }
  fx.sinks = fx.sinks.filter(sk => sk.t < 1);
  const tb = table.target;
  if (!tb.potted) {
    ctx.save(); ctx.setLineDash([5, 5]); ctx.lineDashOffset = t * 12; ctx.strokeStyle = '#e2b13c'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(tb.x, tb.y, R + 7 + Math.sin(t * 3) * 1.5, 0, TAU); ctx.stroke(); ctx.restore();
  }
  for (const b of table.balls) if (!b.potted) drawBall(b, b.x, b.y);
  if (!table.cue.potted) drawBall(table.cue, table.cue.x, table.cue.y);
  drawFlag(t, dt);
  if (phase === 'locked' || phase === 'power') drawCue(locked.angle, phase === 'power' ? meter.b * meter.barMax : 0, 0);
  if (phase === 'strike') drawCue(strike.angle, strike.power, Math.min(1, strike.t / STRIKE_T));

  for (const g of fx.rings) {
    g.life -= dt;
    const k = Math.max(0, g.life / g.max);
    ctx.strokeStyle = `rgba(${g.color},${k * 0.7})`; ctx.lineWidth = 1.5 + 2.5 * k;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r + g.grow * (1 - k), 0, TAU); ctx.stroke();
  }
  fx.rings = fx.rings.filter(g => g.life > 0);
  for (const p of fx.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93; p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  fx.particles = fx.particles.filter(p => p.life > 0);
  ctx.globalAlpha = 1;

  for (const pl of DECOR.plants) drawPlant(pl, t);

  for (const c of fx.confetti) {
    c.life -= dt; c.y += c.vy * dt; c.x += c.vx * dt + Math.sin(c.y * 0.03 + c.rot) * 0.8; c.rot += c.vr * dt;
    ctx.globalAlpha = Math.min(1, c.life); ctx.fillStyle = c.c;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(1, Math.cos(c.rot * 1.7)); ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
  }
  fx.confetti = fx.confetti.filter(c => c.life > 0 && c.y < H + 60);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of fx.floats) {
    f.life -= dt; f.y -= 22 * dt;
    const k = f.life / f.max, pop = k > 0.85 ? 1 + (k - 0.85) * 2 : 1;
    ctx.globalAlpha = Math.min(1, k * 2.5);
    ctx.font = `700 ${f.size * pop}px 'DM Sans', sans-serif`;
    const tw = ctx.measureText(f.text).width;
    ctx.fillStyle = 'rgba(251,248,240,.92)'; ctx.beginPath(); ctx.roundRect(f.x - tw / 2 - 10, f.y - f.size * 0.7, tw + 20, f.size * 1.4, f.size * 0.7); ctx.fill();
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y + 1);
  }
  fx.floats = fx.floats.filter(f => f.life > 0);
  ctx.globalAlpha = 1;

  drawBanner(dt);
  drawStamp(dt);

  for (const c of clouds) {
    c.x += c.v * dt; if (c.x - c.r > x1 + 400) c.x = x0 - c.r - 200;
    ctx.drawImage(CLOUD, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const mx = m.x + Math.sin(t * 0.13 * m.s + m.p) * 40, my = m.y + Math.cos(t * 0.1 * m.s + m.p) * 30 - (t * 4 * m.s) % 60;
    ctx.globalAlpha = 0.25 + 0.35 * Math.sin(t * m.s + m.p) ** 2;
    ctx.drawImage(MOTE, mx - 4, my - 4, 8, 8);
  }
  ctx.globalAlpha = 1;
  ctx.drawImage(LAMP, W / 2 - H * 0.75, H / 2 - H * 0.75, H * 1.5, H * 1.5);
  ctx.globalCompositeOperation = 'source-over';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const vg = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.35, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
  vg.addColorStop(0, 'rgba(60,40,20,0)'); vg.addColorStop(1, 'rgba(60,40,20,.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);
  ctx.save(); ctx.translate((t * 37) % 160, (t * 53) % 160); ctx.fillStyle = GRAIN; ctx.fillRect(-160, -160, cw + 320, ch + 320); ctx.restore();
}

/* ----- loop ----- */

function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, t - (frame.last ?? t));
  frame.last = t;
  if (phase === 'aim') {
    if (!drag) {
      const was = Math.abs(swingPos() - 0.5) <= PERF_A;
      swayT += dt;
      if (!was && Math.abs(swingPos() - 0.5) <= PERF_A) tone(1046, 0.03, 0.015, 'sine', 1, 0, 0);
    }
    updateMeter();
  }
  if (phase === 'power') {
    meter.b += dt / FILL_T;
    const k = Math.floor(meter.b * 10);
    if (k !== meter.tick) { meter.tick = k; sfx.tick(k); }
    if (meter.b >= 1) { meter.b = 1; stopPower(); updateUI(); }
    updateMeter();
  }
  if (phase === 'strike') {
    strike.t += dt;
    if (strike.t >= STRIKE_T) {
      table.shoot(strike.angle, strike.power);
      sfx.strike(strike.power); buzz(8);
      const c = table.cue;
      for (let k = 0; k < 8; k++) fx.particles.push({ x: c.x - Math.cos(strike.angle) * R, y: c.y - Math.sin(strike.angle) * R, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, life: 0.5, color: '#7fa0d8', r: 1.5 });
      acc = 0; phase = 'moving'; updateUI();
    }
  }
  if (phase === 'moving') {
    acc += dt;
    while (acc >= DT) { table.step(); acc -= DT; }
    const c = table.cue, last = curTrail?.pts[curTrail.pts.length - 1];
    if (curTrail && !c.potted && last && Math.hypot(c.x - last[0], c.y - last[1]) > 14) curTrail.pts.push([c.x, c.y]);
    if (!table.moving()) resolveShot();
  }
  draw(t, dt);
  requestAnimationFrame(frame);
}

resize();
const seedParam = new URLSearchParams(location.search).get('seed');
newRound(seedParam || todayKey(), !seedParam);
if (!ls('dailybreak:seenHelp') && !$('overlay').classList.contains('show')) showHelp();
requestAnimationFrame(frame);
</script>
</body>
