# Publishes the game to the daily-break Worker, served at https://dailybreak.app.
# Runs on pushes to main, or by hand from the Actions tab.
# Needs the repository secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token).
# Only deploys once the tests (test.yml) pass.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: tools/build.sh
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
