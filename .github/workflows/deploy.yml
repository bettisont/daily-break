# Publishes the game to the daily-break Worker (https://daily-break.<account>.workers.dev).
# Runs on pushes to main, or by hand from the Actions tab.
# Needs the repository secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: mkdir -p dist && cp index.html dist/
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
